<!DOCTYPE html> 
<html> 
    <head> 
        <meta name="viewport" content="width=device-width, initial-scale=1" /> 
        <title>Mi Primer WebAR con MindAR</title> 
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
         <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script>
AFRAME.registerComponent('video-controller', {
  init: function () {
    let videoEl = document.querySelector('#VideoId');

    this.el.addEventListener('targetFound', event => {
      console.log('Target found - playing video');
      videoEl.play();
    });

    this.el.addEventListener('targetLost', event => {
      console.log('Target lost - pausing video');
      videoEl.pause();
    });
  }
});
</script>



           
    </head> 
    <body> 

<a-scene mindar-image="imageTargetSrc: ./targets/targets.mind;" 
    color-space="sRGB" renderer="colorManagement: true, 
    physicallyCorrectLights" vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    detectionMode: mono_and_matrix 
    matrixCodeType: 3x3 
    trackingMethod: best 
    maxDetectionRate: 60
    > 

    
    
<a-assets>
    <img id="minion" src="images/minion.png">
    <img id="mickey" src="images/mickey.png">
    <video id="VideoUniversal" src="videos/UniversalTrip10mb.mp4" preload="auto" loop="true" playsinline webkit-playsinline></video>
    <video id="VideoDisney" src="videos/DisneyTrip10mb.mp4" preload="auto" loop="true" playsinline webkit-playsinline></video>
  </a-assets>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera> 

<a-entity video-controller
    videoId="#VideoUniversal"
    mindar-image-target="targetIndex: 0" 
    smooth="true" 
    smoothCount="10" 
    smoothTolerance="0.01" 
    smoothThreshold="5"> 
    <a-video src="#VideoUniversal" width="1.6" height="0.9" rotation="0 0 0" position="0 0 0"></a-video> 
</a-entity> 

<a-entity video-controller
    videoId="#VideoDisney"
    mindar-image-target="targetIndex: 1"
    smooth="true" 
    smoothCount="10" 
    smoothTolerance="0.01" 
    smoothThreshold="5"> 
    <a-video src="#VideoDisney" width="1.6" height="0.9" rotation="0 0 0" position="0 0 0"></a-video> 
</a-entity> 
</a-scene> 
</body> 
</html>
