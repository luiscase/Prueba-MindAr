<!DOCTYPE html> 
<html> 
    <head> 
        <meta name="viewport" content="width=device-width, initial-scale=1" /> 
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Mi Primer WebAR con MindAR</title> 
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
         <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<!--Detectar Marcador1 y reproducir video-->

<script>
AFRAME.registerComponent('video-controller1', {
  init: function () {
    const videoEl = document.querySelector('#VideoUniversal');

    this.el.addEventListener('targetFound', event => {
      console.log('Target found - playing video');
      videoEl.play();
    });

    this.el.addEventListener('targetLost', event => {
      console.log('Target lost - pausing video');
      videoEl.pause();
    });
  }
});
</script>

<!--Detectar Marcador2 y reproducir video-->

<script>
AFRAME.registerComponent('video-controller2', {
  init: function () {
    const videoE2 = document.querySelector('#VideoDisney');

    this.el.addEventListener('targetFound', event => {
      console.log('Target found - playing video');
      videoE2.play();
    });

    this.el.addEventListener('targetLost', event => {
      console.log('Target lost - pausing video');
      videoE2.pause();
    });
  }
});
</script>


<style>
        /* Estilos para la ventana de inicio */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(18, 18, 18, 0.95); /* Fondo oscuro */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Asegura que esté por encima de la escena 3D */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: opacity 0.5s ease; /* Efecto de desaparición suave */
        }

        .splash-content {
            text-align: center;
            padding: 20px;
        }

        #start-button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        #start-button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        /* Ocultar la interfaz nativa de A-Frame temporalmente si es necesario */
        .a-enter-vr {
            display: none !important;
        }
    </style>

           
    </head> 
    <body> 


    <!-- 1. VENTANA DE INICIO (SPLASH WINDOW) -->
    <div id="splash-screen">
        <div class="splash-content">
            <h1>Bienvenido a la Experiencia AR</h1>
            <p>Por favor, permite el acceso a la cámara cuando se te solicite.</p>
            <button id="start-button">ENTRAR</button>
        </div>
    </div>


<a-scene mindar-image="imageTargetSrc: ./targets/targets.mind;" 
    color-space="sRGB" renderer="colorManagement: true, 
    physicallyCorrectLights" vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    detectionMode: mono_and_matrix 
    matrixCodeType: 3x3 
    trackingMethod: best 
    maxDetectionRate: 60
    > 

    
    
<a-assets>
    <img id="minion" src="images/minion.png">
    <img id="mickey" src="images/mickey.png">
    <img id="dedo_arriba" src="images/dedo-arriba.png">
    <img id="dedos_abajo" src="images/dedos-abajo.png">
    <img id="sombra" src="images/sombra-16_9.png">
    <video id="VideoUniversal" src="videos/UniversalTrip10mb.mp4" preload="auto" loop="true" playsinline webkit-playsinline></video>
    <video id="VideoDisney" src="videos/DisneyTrip10mb.mp4" preload="auto" loop="true" playsinline webkit-playsinline></video>
  </a-assets>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera> 

<a-entity video-controller1="" mindar-image-target="targetIndex: 0" smooth="true" smoothcount="10" smoothtolerance="0.01" smooththreshold="5"> 
    <a-video src="#VideoUniversal" width="1.6" height="0.9" rotation="" position="0 0 0.27" material="side: front" geometry=""></a-video> 
    <a-image src="#minion" position="-0.85 0.29987 0.1" rotation="" scale="2.3 2.3 2.3" material="" geometry="" visible=""></a-image>
    <a-image src="#dedo_arriba" position="-0.18043 0.48 0.32" rotation="" scale="0.4 0.3 0.4" material="side: front" geometry="" visible=""></a-image>
    <a-image src="#dedos_abajo" position="-0.16935 -0.54 0.3" rotation="" scale="0.7 0.2 0.3" material="side: front" geometry="" visible=""></a-image>
    <a-image src="#sombra" position="-0.03 -0.1 0.26" rotation="" scale="1.6 1 1" material="opacity: 0.8" geometry="" visible="false"></a-image>
</a-entity>

<a-entity video-controller2="" mindar-image-target="targetIndex: 1" smooth="true" smoothcount="10" smoothtolerance="0.01" smooththreshold="5"> 
    <a-video src="#VideoDisney" width="1.6" height="0.9" rotation="" position="0 0 0.27" material="side: front" geometry=""></a-video> 
    <a-image src="#mickey" position="-0.85 0.29987 0.1" rotation="" scale="2.3 2.3 2.3" material="" geometry="" visible=""></a-image>
    <a-image src="#dedo_arriba" position="-0.18043 0.48 0.32" rotation="" scale="0.4 0.3 0.4" material="side: front" geometry="" visible=""></a-image>
    <a-image src="#dedos_abajo" position="-0.16935 -0.54 0.3" rotation="" scale="0.7 0.2 0.3" material="side: front" geometry="" visible=""></a-image>
    <a-image src="#sombra" position="-0.03 -0.1 0.26" rotation="" scale="1.6 1 1" material="opacity: 0.8" geometry="" visible="false"></a-image>
</a-entity>

</a-scene> 

<!-- 3. JAVASCRIPT PARA CONTROLAR LA INTERFAZ -->
    <script>
        const splash = document.getElementById('splash-screen');
        const startButton = document.getElementById('start-button');
        const scene = document.querySelector('a-scene');

        // Pausar la escena al cargar la página para ahorrar recursos antes del click
        scene.pause();

        startButton.addEventListener('click', () => {
            // 1. Reanudar la escena de A-Frame (activa cámara/sensores)
            scene.play();

            // 2. Desvanecer la pantalla de inicio
            splash.style.opacity = 0;

            // 3. Eliminar por completo el div del DOM después de la animación para que no interfiera con los clicks en AR
            setTimeout(() => {
                splash.remove();
                
                // Volver a mostrar el botón nativo de entrar a VR/AR si lo necesitas
                const vrButton = document.querySelector('.a-enter-vr');
                if (vrButton) vrButton.style.display = 'block';
            }, 500); 
        });
    </script>


</body> 
</html>
