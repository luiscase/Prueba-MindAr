<!DOCTYPE html> 
<html> 
    <head> 
        <meta name="viewport" content="width=device-width, initial-scale=1" /> 
        <title>Mi Primer WebAR con MindAR</title> 
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
         <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    </head> 
    <body> 

<a-scene mindar-image="imageTargetSrc: ./targets/targets.mind;" 
    color-space="sRGB" renderer="colorManagement: true, 
    physicallyCorrectLights" vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    detectionMode: mono_and_matrix 
    matrixCodeType: 3x3 
    trackingMethod: best 
    maxDetectionRate: 60
    > 

    
    
<a-assets>
    <img id="minion" src="images/minion.png">
    <img id="mickey" src="images/mickey.png">
  </a-assets>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera> 

<a-entity 
    mindar-image-target="targetIndex: 0" 
    smooth="true" 
    smoothCount="10" 
    smoothTolerance="0.01" 
    smoothThreshold="5"> 
    <a-image position="0 0 0" rotation="0 0 0" scale="1 1 1" src="#minion"></a-image> 
</a-entity> 

<a-entity 
    mindar-image-target="targetIndex: 1"
    smooth="true" 
    smoothCount="10" 
    smoothTolerance="0.01" 
    smoothThreshold="5"> 
    <a-image position="0 0 0" rotation="0 0 0" scale="1 1 1" src="#mickey"></a-image> 
</a-entity> 
</a-scene> 
</body> 
</html>
