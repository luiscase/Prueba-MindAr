
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">

    <title>Experiencia WebAR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        /* Video de cámara: siempre detrás del canvas */
        video[autoplay] {
            position: absolute !important;
            z-index: 0 !important;
            max-width: none !important;
            object-fit: fill;
        }

        /* Escena AR */
        a-scene {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 1 !important;
            background: transparent !important;
        }

        a-scene canvas.a-canvas {
            position: absolute !important;
            left: 0;
            top: 0;
            z-index: 1 !important;
            background: transparent !important;
        }

        .a-enter-vr,
        .a-enter-ar {
            display: none !important;
        }

        /* Pantalla inicial */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: white;
            transition: opacity 0.5s ease;
        }

        #start-button {
            padding: 16px 30px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Botones */
        .control-button {
            position: fixed;
            z-index: 50;
            width: 48px;
            height: 48px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .control-button svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Pantalla completa: esquina superior derecha */
        #fullscreen-button {
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
        }

        /* Bocina: abajo de boton fullscreen */
        #audio-button {
    		top: max(78px, calc(env(safe-area-inset-top) + 58px));
    		right: max(20px, env(safe-area-inset-right));
    		left: auto;
   		 bottom: auto;
   		 transform: none;
        }

        #icon-sound-off,
        #icon-minimize {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Pantalla inicial -->
    <div id="splash-screen">
        <button id="start-button">INICIAR EXPERIENCIA AR</button>
    </div>

    <!-- Escena AR -->
    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            maxTrack: 1;
            filterMinCF: 0.0005;
            filterBeta: 1000;
            warmupTolerance: 5;
            missTolerance: 5;
        "
        color-space="sRGB"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            alpha: true;
            antialias: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
    >

        <a-assets>
            <video
                id="video"
                src="./video.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>

            <video
                id="video2"
                src="./video2.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>
        </a-assets>

        <a-camera
            id="camera"
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <!-- Target -->
        <a-entity id="target" mindar-image-target="targetIndex: 0">

            <a-video
                id="video-plane"
                src="#video"
                width="1"
                height="0.5625"
                position="0 0 0.01"
            ></a-video>

        </a-entity>

        <a-entity id="target" mindar-image-target="targetIndex: 1">

            <a-video
                id="video-plane"
                src="#video2"
                width="1"
                height="0.5625"
                position="0 0 0.01"
            ></a-video>

        </a-entity>

    </a-scene>

    <!-- Botón de pantalla completa -->
    <button id="fullscreen-button" class="control-button" aria-label="Pantalla completa">

        <svg id="icon-maximize" viewBox="0 0 24 24">
            <polyline points="8 3 3 3 3 8"></polyline>
            <polyline points="16 3 21 3 21 8"></polyline>
            <polyline points="3 16 3 21 8 21"></polyline>
            <polyline points="21 16 21 21 16 21"></polyline>
        </svg>

        <svg id="icon-minimize" viewBox="0 0 24 24">
            <polyline points="8 3 8 8 3 8"></polyline>
            <polyline points="16 3 16 8 21 8"></polyline>
            <polyline points="3 16 8 16 8 21"></polyline>
            <polyline points="21 16 16 16 16 21"></polyline>
        </svg>

    </button>

    <!-- Botón de audio -->
    <button id="audio-button" class="control-button" aria-label="Activar o desactivar audio">

        <svg id="icon-sound-off" viewBox="0 0 24 24">
            <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>

        <svg id="icon-sound-on" viewBox="0 0 24 24">
            <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M19 5a10 10 0 0 1 0 14"></path>
        </svg>

    </button>

    <script>
        const scene = document.querySelector("a-scene");

        const startButton = document.getElementById("start-button");
        const splash = document.getElementById("splash-screen");

        const video = document.getElementById("video");
        const target = document.getElementById("target");
        const videoPlane = document.getElementById("video-plane");
        const camera = document.getElementById("camera");

        const audioButton = document.getElementById("audio-button");
        const fullscreenButton = document.getElementById("fullscreen-button");

        const iconSoundOn = document.getElementById("icon-sound-on");
        const iconSoundOff = document.getElementById("icon-sound-off");

        const iconMaximize = document.getElementById("icon-maximize");
        const iconMinimize = document.getElementById("icon-minimize");

        let experienceStarted = false;
        let targetVisible = false;
        let resizeTimer = null;
        let patchedSystem = null;

        video.muted = true;
        video.pause();

        scene.pause();

        // ---------------------------------------
        // INICIAR EXPERIENCIA
        // ---------------------------------------

        startButton.addEventListener("click", async () => {

            if (experienceStarted) return;

            try {

                experienceStarted = true;

                // Solicitar pantalla completa.
                // Si el navegador no la permite, la experiencia continúa.
                try {
                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                } catch (fullscreenError) {
                    console.log("Pantalla completa no disponible:", fullscreenError);
                }

                // Iniciar MindAR
                await scene.systems["mindar-image-system"].start();

                // Mostrar controles
                audioButton.style.display = "flex";
                fullscreenButton.style.display = "flex";

                // Ocultar pantalla inicial
                splash.style.opacity = "0";

                setTimeout(() => {
                    splash.style.display = "none";
                }, 500);

            } catch (error) {

                console.error("Error al iniciar AR:", error);

                experienceStarted = false;

                alert("No se pudo iniciar la cámara. Verifica los permisos del navegador.");

            }

        });

        // ---------------------------------------
        // DETECCIÓN DEL TARGET
        // ---------------------------------------

        target.addEventListener("targetFound", () => {

            targetVisible = true;

            video.play().catch(error => {
                console.log("Error reproduciendo video:", error);
            });

        });

        target.addEventListener("targetLost", () => {

            targetVisible = false;

            video.pause();

        });

        // ---------------------------------------
        // AUDIO
        // ---------------------------------------

        function toggleAudio() {

            video.muted = !video.muted;

            updateAudioIcon();

        }

        function updateAudioIcon() {

            iconSoundOn.style.display = video.muted ? "none" : "block";
            iconSoundOff.style.display = video.muted ? "block" : "none";

        }

        audioButton.addEventListener("click", toggleAudio);

        // ---------------------------------------
        // PANTALLA COMPLETA
        // ---------------------------------------

        fullscreenButton.addEventListener("click", async () => {

            try {

                if (!document.fullscreenElement) {

                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.log("No se pudo cambiar pantalla completa:", error);

            }

        });

        function updateFullscreenIcon() {

            const isFullscreen = !!document.fullscreenElement;

            iconMaximize.style.display = isFullscreen ? "none" : "block";
            iconMinimize.style.display = isFullscreen ? "block" : "none";

            scheduleARResize();

        }

        document.addEventListener("fullscreenchange", updateFullscreenIcon);

        // ---------------------------------------
        // AJUSTE REAL DE MINDAR PARA ORIENTACIÓN
        // ---------------------------------------

        /*
          MindAR A-Frame 1.2.5 no recalcula correctamente
          todos los parámetros al girar el dispositivo.

          Esta función adapta el cálculo de proyección,
          cámara y video al tamaño actual del contenedor.
        */

        function resizeMindARSystem() {

            const system = patchedSystem;

            if (!system || !system.controller || !system.video || !system.container) {
                return;
            }

            const videoCamera = system.video;
            const container = system.container;

            if (!videoCamera.videoWidth || !videoCamera.videoHeight) {
                return;
            }

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            if (!containerWidth || !containerHeight) return;

            // Mantener dimensiones originales del video de cámara
            videoCamera.setAttribute("width", videoCamera.videoWidth);
            videoCamera.setAttribute("height", videoCamera.videoHeight);

            let vw, vh;

            const videoRatio = videoCamera.videoWidth / videoCamera.videoHeight;
            const containerRatio = containerWidth / containerHeight;

            if (videoRatio > containerRatio) {

                vh = containerHeight;
                vw = vh * videoRatio;

            } else {

                vw = containerWidth;
                vh = vw / videoRatio;

            }

            const projection = system.controller.getProjectionMatrix();

            // Corrección de orientación vertical / horizontal
            const inputRatio =
                system.controller.inputWidth / system.controller.inputHeight;

            let inputAdjust;

            if (inputRatio > containerRatio) {

                inputAdjust = videoCamera.width / system.controller.inputWidth;

            } else {

                inputAdjust = videoCamera.height / system.controller.inputHeight;

            }

            let videoDisplayHeight;

            if (inputRatio > containerRatio) {

                videoDisplayHeight = containerHeight;
                videoDisplayHeight *= inputAdjust;

            } else {

                const videoDisplayWidth = containerWidth;

                videoDisplayHeight =
                    videoDisplayWidth /
                    system.controller.inputWidth *
                    system.controller.inputHeight;

                videoDisplayHeight *= inputAdjust;

            }

            const fovAdjust = containerHeight / videoDisplayHeight;

            const fov =
                2 * Math.atan(1 / projection[5] * fovAdjust) * 180 / Math.PI;

            const near = projection[14] / (projection[10] - 1.0);
            const far = projection[14] / (projection[10] + 1.0);

            // Actualizar cámara de A-Frame
            const cameraElement = container.getElementsByTagName("a-camera")[0];

            if (!cameraElement) return;

            const threeCamera = cameraElement.getObject3D("camera");

            if (!threeCamera) return;

            threeCamera.fov = fov;
            threeCamera.near = near;
            threeCamera.far = far;
            threeCamera.aspect = containerWidth / containerHeight;

            threeCamera.updateProjectionMatrix();

            // Reposicionar y redimensionar el video de cámara
            videoCamera.style.top =
                (-(vh - containerHeight) / 2) + "px";

            videoCamera.style.left =
                (-(vw - containerWidth) / 2) + "px";

            videoCamera.style.width = vw + "px";
            videoCamera.style.height = vh + "px";

            // Reajustar canvas
            const canvas = scene.canvas;

            if (canvas && scene.renderer) {

                canvas.style.position = "absolute";
                canvas.style.left = "0px";
                canvas.style.top = "0px";
                canvas.style.width = containerWidth + "px";
                canvas.style.height = containerHeight + "px";

                scene.renderer.setSize(
                    containerWidth,
                    containerHeight,
                    false
                );

            }

            console.log(
                "MindAR recalibrado:",
                containerWidth,
                containerHeight
            );

        }

        // ---------------------------------------
        // PROGRAMAR REAJUSTE
        // ---------------------------------------

        function scheduleARResize() {

            if (!experienceStarted) return;

            clearTimeout(resizeTimer);

            resizeTimer = setTimeout(() => {

                resizeMindARSystem();

            }, 400);

        }

        // ---------------------------------------
        // INSTALAR CORRECCIÓN AL ESTAR LISTO AR
        // ---------------------------------------

        scene.addEventListener("arReady", () => {

            const system = scene.systems["mindar-image-system"];

            if (!system) return;

            patchedSystem = system;

            /*
              Reemplazar el método de reajuste de la instancia.
              MindAR ya registró su listener original; por eso
              añadimos este listener después de arReady.
            */

            system._resize = resizeMindARSystem;

            window.addEventListener("resize", scheduleARResize);

            window.addEventListener("orientationchange", scheduleARResize);

            if (screen.orientation) {
                screen.orientation.addEventListener(
                    "change",
                    scheduleARResize
                );
            }

            if (window.visualViewport) {
                window.visualViewport.addEventListener(
                    "resize",
                    scheduleARResize
                );
            }

            // Primera calibración
            scheduleARResize();

        });

        // ---------------------------------------
        // SALIR / ENTRAR DE PANTALLA COMPLETA
        // ---------------------------------------

        /*
          IMPORTANTE:
          No llamamos stop(), pause() ni start() de MindAR.
          Así la cámara sigue transmitiendo al salir de fullscreen.
        */

        document.addEventListener("fullscreenchange", () => {

            updateFullscreenIcon();

            scheduleARResize();

        });

        // ---------------------------------------
        // PAUSAR VIDEO DE CONTENIDO AL OCULTAR PÁGINA
        // ---------------------------------------

        document.addEventListener("visibilitychange", () => {

            if (document.hidden) {

                video.pause();

            } else if (targetVisible) {

                video.play().catch(error => {
                    console.log("No se pudo reanudar el video:", error);
                });

            }

        });

        // ---------------------------------------
        // TOCAR VIDEO PARA ACTIVAR / DESACTIVAR AUDIO
        // ---------------------------------------

        scene.addEventListener("loaded", () => {

            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();

            scene.canvas.addEventListener("pointerup", (event) => {

                if (!experienceStarted || !targetVisible) return;

                // Evitar que el toque sobre los botones active el audio
                if (
                    event.target.closest &&
                    event.target.closest(".control-button")
                ) {
                    return;
                }

                const rect = scene.canvas.getBoundingClientRect();

                pointer.x =
                    ((event.clientX - rect.left) / rect.width) * 2 - 1;

                pointer.y =
                    -((event.clientY - rect.top) / rect.height) * 2 + 1;

                const threeCamera = camera.getObject3D("camera");

                if (!threeCamera) return;

                raycaster.setFromCamera(pointer, threeCamera);

                const intersections = raycaster.intersectObject(
                    videoPlane.object3D,
                    true
                );

                if (intersections.length > 0) {
                    toggleAudio();
                }

            });

        });

        // ---------------------------------------
        // ESTADO INICIAL
        // ---------------------------------------

        updateAudioIcon();
        updateFullscreenIcon();

    </script>

</body>
</html>
