
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Experiencia WebAR</title>

    <!-- A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* Escena AR */
        a-scene {
            position: fixed !important;
            inset: 0;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 1;
        }

        .a-enter-vr,
        .a-enter-ar {
            display: none !important;
        }

        /* Pantalla inicial */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: white;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        #start-button {
            padding: 15px 30px;
            border: 0;
            border-radius: 30px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Controles */
        #controls {
            position: fixed;
            z-index: 20;
            right: max(20px, env(safe-area-inset-right));
            bottom: max(20px, env(safe-area-inset-bottom));
            display: none;
            gap: 12px;
        }

        .control-button {
            width: 48px;
            height: 48px;
            border: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .control-button svg {
            width: 23px;
            height: 23px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Iconos */
        #icon-sound-off,
        #icon-minimize {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Pantalla de inicio -->
    <div id="splash-screen">
        <button id="start-button">INICIAR EXPERIENCIA AR</button>
    </div>

    <!-- Escena AR -->
    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            maxTrack: 1;
            filterMinCF: 0.0005;
            filterBeta: 1000;
            warmupTolerance: 5;
            missTolerance: 5;
        "
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
    >

        <a-assets>
            <video
                id="video"
                src="./video.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>
        </a-assets>

        <a-camera
            id="camera"
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <!-- Marcador -->
        <a-entity id="target" mindar-image-target="targetIndex: 0">

            <!-- Video 16:9 -->
            <a-video
                id="video-plane"
                src="#video"
                width="1"
                height="0.5625"
                position="0 0 0.01"
            ></a-video>

        </a-entity>

    </a-scene>

    <!-- Controles inferiores -->
    <div id="controls">

        <!-- Audio -->
        <button class="control-button" id="audio-button" aria-label="Activar o desactivar audio">

            <svg id="icon-sound-off" viewBox="0 0 24 24">
                <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>

            <svg id="icon-sound-on" viewBox="0 0 24 24">
                <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                <path d="M19 5a10 10 0 0 1 0 14"></path>
            </svg>

        </button>

        <!-- Pantalla completa -->
        <button class="control-button" id="fullscreen-button" aria-label="Pantalla completa">

            <svg id="icon-maximize" viewBox="0 0 24 24">
                <polyline points="8 3 3 3 3 8"></polyline>
                <polyline points="16 3 21 3 21 8"></polyline>
                <polyline points="3 16 3 21 8 21"></polyline>
                <polyline points="21 16 21 21 16 21"></polyline>
            </svg>

            <svg id="icon-minimize" viewBox="0 0 24 24">
                <polyline points="8 3 8 8 3 8"></polyline>
                <polyline points="16 3 16 8 21 8"></polyline>
                <polyline points="3 16 8 16 8 21"></polyline>
                <polyline points="21 16 16 16 16 21"></polyline>
            </svg>

        </button>

    </div>

    <script>
        const scene = document.querySelector("a-scene");
        const startButton = document.getElementById("start-button");
        const splash = document.getElementById("splash-screen");

        const video = document.getElementById("video");
        const target = document.getElementById("target");
        const videoPlane = document.getElementById("video-plane");
        const camera = document.getElementById("camera");

        const controls = document.getElementById("controls");
        const audioButton = document.getElementById("audio-button");
        const fullscreenButton = document.getElementById("fullscreen-button");

        const iconSoundOn = document.getElementById("icon-sound-on");
        const iconSoundOff = document.getElementById("icon-sound-off");

        const iconMaximize = document.getElementById("icon-maximize");
        const iconMinimize = document.getElementById("icon-minimize");

        let experienceStarted = false;
        let targetVisible = false;
        let resizeTimeout = null;

        // Estado inicial del video
        video.muted = true;
        video.pause();

        // Ocultar escena antes de iniciar
        scene.pause();

        // ----------------------------------
        // INICIAR EXPERIENCIA AR
        // ----------------------------------

        startButton.addEventListener("click", async () => {

            if (experienceStarted) return;

            try {

                experienceStarted = true;

                // Solicitar pantalla completa
                if (document.documentElement.requestFullscreen) {
                    try {
                        await document.documentElement.requestFullscreen();
                    } catch (error) {
                        console.log("Pantalla completa no disponible:", error);
                    }
                }

                // Iniciar MindAR
                await scene.systems["mindar-image-system"].start();

                // Mostrar controles
                controls.style.display = "flex";

                // Ocultar splash
                splash.style.opacity = "0";

                setTimeout(() => {
                    splash.style.display = "none";
                }, 500);

                refreshARLayout();

            } catch (error) {

                console.error("Error al iniciar AR:", error);
                experienceStarted = false;

                alert("No se pudo iniciar la cámara. Verifica los permisos del navegador.");

            }

        });

        // ----------------------------------
        // DETECCIÓN DEL MARCADOR
        // ----------------------------------

        target.addEventListener("targetFound", () => {

            targetVisible = true;

            video.play().catch(error => {
                console.log("No se pudo reproducir el video:", error);
            });

        });

        target.addEventListener("targetLost", () => {

            targetVisible = false;
            video.pause();

        });

        // ----------------------------------
        // CONTROL DE AUDIO
        // ----------------------------------

        function toggleAudio() {

            video.muted = !video.muted;

            updateAudioIcon();

        }

        function updateAudioIcon() {

            iconSoundOn.style.display = video.muted ? "none" : "block";
            iconSoundOff.style.display = video.muted ? "block" : "none";

        }

        audioButton.addEventListener("click", toggleAudio);

        // ----------------------------------
        // PANTALLA COMPLETA
        // ----------------------------------

        fullscreenButton.addEventListener("click", async () => {

            try {

                if (!document.fullscreenElement) {

                    await document.documentElement.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.log("No se pudo cambiar pantalla completa:", error);

            }

        });

        function updateFullscreenIcon() {

            const isFullscreen = !!document.fullscreenElement;

            iconMaximize.style.display = isFullscreen ? "none" : "block";
            iconMinimize.style.display = isFullscreen ? "block" : "none";

            // Reajustar dimensiones sin detener la cámara
            refreshARLayout();

        }

        document.addEventListener("fullscreenchange", updateFullscreenIcon);

        // ----------------------------------
        // DETECTAR CAMBIO DE ORIENTACIÓN
        // ----------------------------------

        window.addEventListener("orientationchange", refreshARLayout);

        window.addEventListener("resize", refreshARLayout);

        if (screen.orientation) {
            screen.orientation.addEventListener("change", refreshARLayout);
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", refreshARLayout);
        }

        // ----------------------------------
        // FUNCIÓN DE REAJUSTE AR
        // ----------------------------------

        function refreshARLayout() {

            if (!experienceStarted || !scene.hasLoaded) return;

            clearTimeout(resizeTimeout);

            resizeTimeout = setTimeout(() => {

                const width = window.innerWidth;
                const height = window.innerHeight;

                if (scene.renderer && scene.canvas) {

                    scene.renderer.setSize(width, height, false);

                    scene.canvas.style.width = width + "px";
                    scene.canvas.style.height = height + "px";

                }

                camera.object3D.updateMatrixWorld(true);
                videoPlane.object3D.updateMatrixWorld(true);

                console.log("AR reajustado:", width, height);

                /*
                    IMPORTANTE:
                    No detener ni reiniciar MindAR.
                    No disparar otro evento resize.
                    Esto evita ciclos infinitos de reajuste.
                */

            }, 300);

        }

        // ----------------------------------
        // PAUSAR VIDEO SI SE OCULTA LA PÁGINA
        // ----------------------------------

        document.addEventListener("visibilitychange", () => {

            if (document.hidden) {

                video.pause();

            } else if (targetVisible) {

                video.play().catch(error => {
                    console.log("No se pudo reanudar el video:", error);
                });

            }

        });

        // ----------------------------------
        // DETECTAR TOQUE SOBRE EL VIDEO
        // PARA ACTIVAR / DESACTIVAR AUDIO
        // ----------------------------------

        scene.addEventListener("loaded", () => {

            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();

            scene.canvas.addEventListener("pointerup", (event) => {

                if (!experienceStarted || !targetVisible) return;

                const rect = scene.canvas.getBoundingClientRect();

                pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                const cam = camera.getObject3D("camera");

                if (!cam) return;

                raycaster.setFromCamera(pointer, cam);

                const intersections = raycaster.intersectObject(
                    videoPlane.object3D,
                    true
                );

                if (intersections.length > 0) {

                    toggleAudio();

                }

            });

        });

        // Estado inicial de iconos
        updateAudioIcon();
        updateFullscreenIcon();

    </script>

</body>
</html>
