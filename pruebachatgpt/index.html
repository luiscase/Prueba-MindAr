
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Experiencia WebAR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            position: fixed;
            inset: 0;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: fixed !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden;
        }

        /* Pantalla inicial */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #fff;
            text-align: center;
            padding: 25px;
        }

        #start-button {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #000;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Mensaje para escanear */
        #scan-message {
            position: fixed;
            z-index: 900;
            left: 50%;
            bottom: max(45px, calc(env(safe-area-inset-bottom) + 25px));
            transform: translateX(-50%);
            width: min(90%, 420px);
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.70);
            color: #fff;
            text-align: center;
            font-size: 16px;
            line-height: 1.4;
            font-weight: 500;
            display: none;
            pointer-events: none;
        }

        /* Controles */
        .control-button {
            position: fixed;
            z-index: 1100;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 10px;
        }

        .control-button svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #fullscreen-button {
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
        }

        #audio-button {
            top: max(78px, calc(env(safe-area-inset-top) + 58px));
            right: max(20px, env(safe-area-inset-right));
        }

        /* Ocultar controles de A-Frame */
        .a-enter-vr,
        .a-enter-ar {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- Pantalla inicial -->
    <div id="splash-screen">
        <div>
            <h2>Experiencia de Realidad Aumentada</h2>
            <p>Presiona el botón para comenzar.</p>
            <button id="start-button">INICIAR EXPERIENCIA</button>
        </div>
    </div>

    <!-- Mensaje cuando no se detecta ningún marcador -->
    <div id="scan-message">
        Por favor, escanea la imagen para iniciar la experiencia.
    </div>

    <!-- Botón pantalla completa -->
    <button id="fullscreen-button"
            class="control-button"
            aria-label="Pantalla completa">

        <svg id="icon-maximize" viewBox="0 0 24 24">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
            <path d="M21 16v3a2 2 0 0 1-2 2h-3"></path>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>

        <svg id="icon-minimize" viewBox="0 0 24 24" style="display:none">
            <path d="M8 3v5H3"></path>
            <path d="M16 3v5h5"></path>
            <path d="M3 16h5v5"></path>
            <path d="M21 16h-5v5"></path>
        </svg>

    </button>

    <!-- Botón de audio -->
    <button id="audio-button"
            class="control-button"
            aria-label="Activar o desactivar audio">

        <svg id="icon-sound-off" viewBox="0 0 24 24">
            <path d="M11 5 6 9H2v6h4l5 4z"></path>
            <path d="m22 9-6 6"></path>
            <path d="m16 9 6 6"></path>
        </svg>

        <svg id="icon-sound-on" viewBox="0 0 24 24" style="display:none">
            <path d="M11 5 6 9H2v6h4l5 4z"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M19 5a10 10 0 0 1 0 14"></path>
        </svg>

    </button>

    <!-- Escena AR -->
    <a-scene
        id="scene"
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            maxTrack: 1;
            filterMinCF: 0.0005;
            filterBeta: 1000;
            warmupTolerance: 5;
            missTolerance: 5;
        "
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
    >

        <a-assets>

            <video
                id="video1"
                src="./video1.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous">
            </video>

            <video
                id="video2"
                src="./video2.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous">
            </video>

        </a-assets>

        <!-- Cámara -->
        <a-camera
            id="camera"
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <!-- MARCADOR 1 -->
        <a-entity
            id="target1"
            mindar-image-target="targetIndex: 0">

            <a-video
                id="video-plane1"
                src="#video1"
                width="1"
                height="0.5625"
                position="0 0 0.01">
            </a-video>

            <!-- Área táctil del mensaje de audio -->
            <a-plane
                id="sound-hit1"
                width="1"
                height="0.13"
                position="0 -0.36 0.025"
                material="color: #000000; transparent: true; opacity: 0.01; depthWrite: false">
            </a-plane>

            <!-- Texto anclado al marcador -->
            <a-text
                id="sound-text1"
                value="Click para activar sonido"
                color="#FFFFFF"
                align="center"
                anchor="center"
                width="1.5"
                scale="0.75 0.75 0.75"
                position="0 -0.36 0.03"
                shader="msdf"
                negate="false">
            </a-text>

        </a-entity>

        <!-- MARCADOR 2 -->
        <a-entity
            id="target2"
            mindar-image-target="targetIndex: 1">

            <a-video
                id="video-plane2"
                src="#video2"
                width="1"
                height="0.5625"
                position="0 0 0.01">
            </a-video>

            <!-- Área táctil del mensaje de audio -->
            <a-plane
                id="sound-hit2"
                width="1"
                height="0.13"
                position="0 -0.36 0.025"
                material="color: #000000; transparent: true; opacity: 0.01; depthWrite: false">
            </a-plane>

            <!-- Texto anclado al marcador -->
            <a-text
                id="sound-text2"
                value="Click para activar sonido"
                color="#FFFFFF"
                align="center"
                anchor="center"
                width="1.5"
                scale="0.75 0.75 0.75"
                position="0 -0.36 0.03"
                shader="msdf"
                negate="false">
            </a-text>

        </a-entity>

    </a-scene>

    <script>
    document.addEventListener("DOMContentLoaded", () => {

        const scene = document.querySelector("#scene");
        const splash = document.querySelector("#splash-screen");
        const startButton = document.querySelector("#start-button");

        const scanMessage = document.querySelector("#scan-message");

        const fullscreenButton = document.querySelector("#fullscreen-button");
        const audioButton = document.querySelector("#audio-button");

        const iconMaximize = document.querySelector("#icon-maximize");
        const iconMinimize = document.querySelector("#icon-minimize");

        const iconSoundOn = document.querySelector("#icon-sound-on");
        const iconSoundOff = document.querySelector("#icon-sound-off");

        const target1 = document.querySelector("#target1");
        const target2 = document.querySelector("#target2");

        const video1 = document.querySelector("#video1");
        const video2 = document.querySelector("#video2");

        const videoPlane1 = document.querySelector("#video-plane1");
        const videoPlane2 = document.querySelector("#video-plane2");

        const soundHit1 = document.querySelector("#sound-hit1");
        const soundHit2 = document.querySelector("#sound-hit2");

        const soundText1 = document.querySelector("#sound-text1");
        const soundText2 = document.querySelector("#sound-text2");

        /*
         * Detectar Safari en iPhone.
         * Se excluyen navegadores alternativos que usan otros identificadores.
         */

        const isIPhone = /iPhone|iPod/i.test(navigator.userAgent);

        const isSafari = /Safari/i.test(navigator.userAgent) &&
            !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/i.test(navigator.userAgent);

        const isIPhoneSafari = isIPhone && isSafari;

        let experienceStarted = false;

        let target1Visible = false;
        let target2Visible = false;

        let activeVideo = null;
        let activeVideoPlane = null;
        let activeSoundHit = null;
        let activeSoundText = null;

        let patchedSystem = null;
        let resizeTimeout = null;

        /*
         * Ocultar pantalla completa en Safari de iPhone.
         */

        if (isIPhoneSafari) {
            fullscreenButton.style.display = "none";
        }

        /* --------------------------------
           FUNCIONES DE VIDEO
        -------------------------------- */

        function updateSoundPrompt() {

            if (soundText1) {
                soundText1.setAttribute(
                    "visible",
                    activeVideo === video1 && video1.muted
                );
            }

            if (soundText2) {
                soundText2.setAttribute(
                    "visible",
                    activeVideo === video2 && video2.muted
                );
            }

        }

        function playTargetVideo(video, plane, soundHit, soundText) {

            if (activeVideo && activeVideo !== video) {
                activeVideo.pause();
            }

            if (video1 !== video) video1.pause();
            if (video2 !== video) video2.pause();

            activeVideo = video;
            activeVideoPlane = plane;
            activeSoundHit = soundHit;
            activeSoundText = soundText;

            updateSoundPrompt();

            video.play().catch(error => {
                console.error("Error reproduciendo video:", error);
            });

            updateAudioIcon();
        }

        function pauseTargetVideo(video) {

            video.pause();

            if (activeVideo === video) {

                activeVideo = null;
                activeVideoPlane = null;
                activeSoundHit = null;
                activeSoundText = null;

            }

            updateSoundPrompt();
            updateAudioIcon();
        }

        /* --------------------------------
           MENSAJE PARA ESCANEAR
        -------------------------------- */

        function updateScanMessage() {

            if (!experienceStarted) {
                scanMessage.style.display = "none";
                return;
            }

            if (!target1Visible && !target2Visible) {
                scanMessage.style.display = "block";
            } else {
                scanMessage.style.display = "none";
            }

        }

        /* --------------------------------
           DETECCIÓN DE MARCADORES
        -------------------------------- */

        target1.addEventListener("targetFound", () => {

            console.log("Marcador 1 encontrado");

            target1Visible = true;
            target2Visible = false;

            updateScanMessage();

            playTargetVideo(
                video1,
                videoPlane1,
                soundHit1,
                soundText1
            );

        });

        target1.addEventListener("targetLost", () => {

            console.log("Marcador 1 perdido");

            target1Visible = false;

            pauseTargetVideo(video1);

            updateScanMessage();

        });

        target2.addEventListener("targetFound", () => {

            console.log("Marcador 2 encontrado");

            target2Visible = true;
            target1Visible = false;

            updateScanMessage();

            playTargetVideo(
                video2,
                videoPlane2,
                soundHit2,
                soundText2
            );

        });

        target2.addEventListener("targetLost", () => {

            console.log("Marcador 2 perdido");

            target2Visible = false;

            pauseTargetVideo(video2);

            updateScanMessage();

        });

        /* --------------------------------
           CONTROL DE AUDIO
        -------------------------------- */

        function updateAudioIcon() {

            const muted = !activeVideo || activeVideo.muted;

            iconSoundOn.style.display = muted ? "none" : "block";
            iconSoundOff.style.display = muted ? "block" : "none";

        }

        function toggleAudio() {

            if (!activeVideo) return;

            activeVideo.muted = !activeVideo.muted;

            updateAudioIcon();
            updateSoundPrompt();

        }

        audioButton.addEventListener("click", toggleAudio);

        /* --------------------------------
           TOCAR VIDEO O TEXTO PARA ACTIVAR AUDIO
        -------------------------------- */

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function handleVideoTouch(event) {

            if (!activeVideo || !activeVideoPlane) return;

            const canvas = scene.canvas;

            if (!canvas) return;

            const rect = canvas.getBoundingClientRect();

            const touch = event.changedTouches
                ? event.changedTouches[0]
                : event;

            pointer.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;

            const cameraObject = document.querySelector("#camera")
                .getObject3D("camera");

            if (!cameraObject) return;

            raycaster.setFromCamera(pointer, cameraObject);

            const objectsToCheck = [
                activeVideoPlane.object3D
            ];

            if (activeSoundHit) {
                objectsToCheck.push(activeSoundHit.object3D);
            }

            if (activeSoundText) {
                objectsToCheck.push(activeSoundText.object3D);
            }

            const intersections = raycaster.intersectObjects(
                objectsToCheck,
                true
            );

            if (intersections.length > 0) {
                toggleAudio();
            }

        }

        document.addEventListener("click", event => {

            if (
                event.target.closest("#fullscreen-button") ||
                event.target.closest("#audio-button") ||
                event.target.closest("#start-button")
            ) return;

            handleVideoTouch(event);

        });

        /* --------------------------------
           PANTALLA COMPLETA
        -------------------------------- */

        function updateFullscreenIcon() {

            const isFullscreen = !!document.fullscreenElement;

            iconMaximize.style.display = isFullscreen ? "none" : "block";
            iconMinimize.style.display = isFullscreen ? "block" : "none";

        }

        fullscreenButton.addEventListener("click", async () => {

            if (isIPhoneSafari) return;

            try {

                if (!document.fullscreenElement) {

                    const element = document.documentElement;

                    if (element.requestFullscreen) {
                        await element.requestFullscreen();
                    }

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.warn("Pantalla completa no disponible:", error);

            }

            updateFullscreenIcon();
            scheduleARResize();

        });

        document.addEventListener("fullscreenchange", () => {

            updateFullscreenIcon();
            scheduleARResize();

        });

        /* --------------------------------
           RECALIBRACIÓN DE MINDAR
        -------------------------------- */

        function resizeMindARSystem() {

            const system = patchedSystem;

            if (!system || !system.controller || !system.video || !system.container) {
                return;
            }

            const videoCamera = system.video;
            const container = system.container;

            if (!videoCamera.videoWidth || !videoCamera.videoHeight) {
                return;
            }

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            if (!containerWidth || !containerHeight) return;

            videoCamera.setAttribute("width", videoCamera.videoWidth);
            videoCamera.setAttribute("height", videoCamera.videoHeight);

            const videoRatio = videoCamera.videoWidth / videoCamera.videoHeight;
            const containerRatio = containerWidth / containerHeight;

            let vw, vh;

            if (videoRatio > containerRatio) {
                vh = containerHeight;
                vw = vh * videoRatio;
            } else {
                vw = containerWidth;
                vh = vw / videoRatio;
            }

            const projection = system.controller.getProjectionMatrix();

            const inputRatio =
                system.controller.inputWidth / system.controller.inputHeight;

            let inputAdjust;

            if (inputRatio > containerRatio) {
                inputAdjust = videoCamera.width / system.controller.inputWidth;
            } else {
                inputAdjust = videoCamera.height / system.controller.inputHeight;
            }

            let videoDisplayHeight;

            if (inputRatio > containerRatio) {

                videoDisplayHeight = containerHeight;
                videoDisplayHeight *= inputAdjust;

            } else {

                const videoDisplayWidth = containerWidth;

                videoDisplayHeight =
                    videoDisplayWidth /
                    system.controller.inputWidth *
                    system.controller.inputHeight;

                videoDisplayHeight *= inputAdjust;

            }

            const fovAdjust = containerHeight / videoDisplayHeight;

            const fov =
                2 * Math.atan(1 / projection[5] * fovAdjust) * 180 / Math.PI;

            const near = projection[14] / (projection[10] - 1.0);
            const far = projection[14] / (projection[10] + 1.0);

            const cameraElement = container.getElementsByTagName("a-camera")[0];

            if (!cameraElement) return;

            const threeCamera = cameraElement.getObject3D("camera");

            if (!threeCamera) return;

            threeCamera.fov = fov;
            threeCamera.near = near;
            threeCamera.far = far;
            threeCamera.aspect = containerWidth / containerHeight;

            threeCamera.updateProjectionMatrix();

            videoCamera.style.position = "absolute";
            videoCamera.style.top = (-(vh - containerHeight) / 2) + "px";
            videoCamera.style.left = (-(vw - containerWidth) / 2) + "px";
            videoCamera.style.width = vw + "px";
            videoCamera.style.height = vh + "px";

            if (scene.canvas && scene.renderer) {

                scene.canvas.style.position = "absolute";
                scene.canvas.style.left = "0px";
                scene.canvas.style.top = "0px";
                scene.canvas.style.width = containerWidth + "px";
                scene.canvas.style.height = containerHeight + "px";

                scene.renderer.setSize(
                    containerWidth,
                    containerHeight,
                    false
                );

            }

            console.log(
                "MindAR recalibrado:",
                containerWidth,
                containerHeight
            );

        }

        /* --------------------------------
           REAJUSTAR DESPUÉS DE FULLSCREEN
        -------------------------------- */

        function scheduleARResize() {

            if (!experienceStarted) return;

            clearTimeout(resizeTimeout);

            resizeTimeout = setTimeout(() => {

                resizeMindARSystem();

                requestAnimationFrame(() => {
                    resizeMindARSystem();
                });

                setTimeout(() => {
                    resizeMindARSystem();
                }, 300);

                setTimeout(() => {
                    resizeMindARSystem();
                }, 700);

            }, 150);

        }

        /* --------------------------------
           INICIO DE EXPERIENCIA
        -------------------------------- */

        startButton.addEventListener("click", async () => {

            if (experienceStarted) return;

            try {

                startButton.disabled = true;
                startButton.textContent = "INICIANDO...";

                /*
                 * Android y navegadores compatibles:
                 * solicitar pantalla completa.
                 *
                 * Safari en iPhone:
                 * no solicitar pantalla completa.
                 */

                let fullscreenPromise = Promise.resolve();

                if (!isIPhoneSafari && !document.fullscreenElement) {

                    const element = document.documentElement;

                    if (element.requestFullscreen) {

                        fullscreenPromise = element.requestFullscreen()
                            .catch(error => {

                                console.warn(
                                    "No fue posible activar pantalla completa:",
                                    error
                                );

                            });

                    }

                }

                // Iniciar MindAR
                await scene.systems["mindar-image-system"].start();

                experienceStarted = true;

                splash.style.display = "none";

                // Mostrar controles
                if (!isIPhoneSafari) {
                    fullscreenButton.style.display = "flex";
                }

                audioButton.style.display = "flex";

                // Videos inicialmente en mute
                video1.muted = true;
                video2.muted = true;

                updateAudioIcon();
                updateSoundPrompt();
                updateScanMessage();

                // Esperar respuesta de pantalla completa
                await fullscreenPromise;

                // Recalibrar cámara
                scheduleARResize();

                console.log("Experiencia AR iniciada correctamente");

            } catch (error) {

                console.error("ERROR COMPLETO AL INICIAR AR:", error);

                experienceStarted = false;

                startButton.disabled = false;
                startButton.textContent = "REINTENTAR";

                alert(
                    "Error al iniciar AR:\n" +
                    (error.message || error)
                );

            }

        });

        /* --------------------------------
           ERRORES DE MINDAR
        -------------------------------- */

        scene.addEventListener("arError", event => {

            console.error("ERROR INTERNO DE MINDAR:", event);

        });

        /* --------------------------------
           MINDAR LISTO
        -------------------------------- */

        scene.addEventListener("arReady", () => {

            console.log("MindAR está listo");

            const system = scene.systems["mindar-image-system"];

            if (!system) {

                console.error("No se encontró el sistema MindAR");
                return;

            }

            patchedSystem = system;

            system._resize = resizeMindARSystem;

            window.addEventListener("resize", scheduleARResize);

            window.addEventListener("orientationchange", scheduleARResize);

            if (screen.orientation) {

                screen.orientation.addEventListener(
                    "change",
                    scheduleARResize
                );

            }

            if (window.visualViewport) {

                window.visualViewport.addEventListener(
                    "resize",
                    scheduleARResize
                );

            }

            scheduleARResize();

        });

        /* --------------------------------
           CUANDO EL USUARIO SALE DE LA PÁGINA
        -------------------------------- */

        document.addEventListener("visibilitychange", () => {

            if (document.hidden) {

                if (activeVideo) {
                    activeVideo.pause();
                }

            } else {

                if (target1Visible) {

                    playTargetVideo(
                        video1,
                        videoPlane1,
                        soundHit1,
                        soundText1
                    );

                } else if (target2Visible) {

                    playTargetVideo(
                        video2,
                        videoPlane2,
                        soundHit2,
                        soundText2
                    );

                }

            }

        });

        /* --------------------------------
           INICIALIZACIÓN DE ICONOS
        -------------------------------- */

        updateAudioIcon();
        updateFullscreenIcon();

    });
    </script>

</body>
</html>
