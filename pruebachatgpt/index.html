
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">

    <title>Experiencia WebAR - 2 Marcadores</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        video[autoplay] {
            position: absolute !important;
            z-index: 0 !important;
            max-width: none !important;
            object-fit: fill;
        }

        a-scene {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 1 !important;
            background: transparent !important;
        }

        a-scene canvas.a-canvas {
            position: absolute !important;
            left: 0;
            top: 0;
            z-index: 1 !important;
            background: transparent !important;
        }

        .a-enter-vr,
        .a-enter-ar {
            display: none !important;
        }

        /* Pantalla inicial */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: white;
            transition: opacity 0.5s ease;
        }

        #start-button {
            padding: 16px 30px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Botones */
        .control-button {
            position: fixed;
            z-index: 50;
            width: 48px;
            height: 48px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .control-button svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Pantalla completa */
        #fullscreen-button {
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
        }

        /* Audio debajo de pantalla completa */
        #audio-button {
            top: max(78px, calc(env(safe-area-inset-top) + 58px));
            right: max(20px, env(safe-area-inset-right));
        }

        #icon-sound-off,
        #icon-minimize {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Pantalla inicial -->
    <div id="splash-screen">
        <button id="start-button">INICIAR EXPERIENCIA AR</button>
    </div>

    <!-- Escena AR -->
    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            maxTrack: 1;
            filterMinCF: 0.0005;
            filterBeta: 1000;
            warmupTolerance: 5;
            missTolerance: 5;
        "
        color-space="sRGB"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            alpha: true;
            antialias: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
    >

        <a-assets>

            <!-- Video del marcador 1 -->
            <video
                id="video1"
                src="./video1.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>

            <!-- Video del marcador 2 -->
            <video
                id="video2"
                src="./video2.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>

        </a-assets>

        <a-camera
            id="camera"
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <!-- MARCADOR 1 -->
        <a-entity
            id="target1"
            mindar-image-target="targetIndex: 0"
        >

            <a-video
                id="video-plane1"
                src="#video1"
                width="1"
                height="0.5625"
                position="0 0 0.01"
            ></a-video>

        </a-entity>

        <!-- MARCADOR 2 -->
        <a-entity
            id="target2"
            mindar-image-target="targetIndex: 1"
        >

            <a-video
                id="video-plane2"
                src="#video2"
                width="1"
                height="0.5625"
                position="0 0 0.01"
            ></a-video>

        </a-entity>

    </a-scene>

    <!-- Pantalla completa -->
    <button id="fullscreen-button" class="control-button" aria-label="Pantalla completa">

        <svg id="icon-maximize" viewBox="0 0 24 24">
            <polyline points="8 3 3 3 3 8"></polyline>
            <polyline points="16 3 21 3 21 8"></polyline>
            <polyline points="3 16 3 21 8 21"></polyline>
            <polyline points="21 16 21 21 16 21"></polyline>
        </svg>

        <svg id="icon-minimize" viewBox="0 0 24 24">
            <polyline points="8 3 8 8 3 8"></polyline>
            <polyline points="16 3 16 8 21 8"></polyline>
            <polyline points="3 16 8 16 8 21"></polyline>
            <polyline points="21 16 16 16 16 21"></polyline>
        </svg>

    </button>

    <!-- Audio -->
    <button id="audio-button" class="control-button" aria-label="Activar o desactivar audio">

        <svg id="icon-sound-off" viewBox="0 0 24 24">
            <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>

        <svg id="icon-sound-on" viewBox="0 0 24 24">
            <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M19 5a10 10 0 0 1 0 14"></path>
        </svg>

    </button>

    <script>

        const scene = document.querySelector("a-scene");

        const startButton = document.getElementById("start-button");
        const splash = document.getElementById("splash-screen");

        const camera = document.getElementById("camera");

        // Videos
        const video1 = document.getElementById("video1");
        const video2 = document.getElementById("video2");

        // Marcadores
        const target1 = document.getElementById("target1");
        const target2 = document.getElementById("target2");

        // Planos de video
        const videoPlane1 = document.getElementById("video-plane1");
        const videoPlane2 = document.getElementById("video-plane2");

        // Controles
        const audioButton = document.getElementById("audio-button");
        const fullscreenButton = document.getElementById("fullscreen-button");

        const iconSoundOn = document.getElementById("icon-sound-on");
        const iconSoundOff = document.getElementById("icon-sound-off");

        const iconMaximize = document.getElementById("icon-maximize");
        const iconMinimize = document.getElementById("icon-minimize");

        let experienceStarted = false;

        let target1Visible = false;
        let target2Visible = false;

        let activeVideo = null;
        let activeVideoPlane = null;

        let resizeTimer = null;
        let patchedSystem = null;

        // ---------------------------------------
        // CONFIGURACIÓN INICIAL
        // ---------------------------------------

        video1.muted = true;
        video2.muted = true;

        video1.pause();
        video2.pause();

        scene.pause();

        // ---------------------------------------
        // INICIAR EXPERIENCIA
        // ---------------------------------------

        startButton.addEventListener("click", async () => {

            if (experienceStarted) return;

            try {

                experienceStarted = true;

                // Solicitar pantalla completa
                try {

                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }

                } catch (fullscreenError) {

                    console.log("Pantalla completa no disponible:", fullscreenError);

                }

                // Iniciar MindAR
                await scene.systems["mindar-image-system"].start();

                // Mostrar controles
                audioButton.style.display = "flex";
                fullscreenButton.style.display = "flex";

                // Ocultar splash
                splash.style.opacity = "0";

                setTimeout(() => {
                    splash.style.display = "none";
                }, 500);

            } catch (error) {

                console.error("Error al iniciar AR:", error);

                experienceStarted = false;

                alert("No se pudo iniciar la cámara. Verifica los permisos del navegador.");

            }

        });

        // ---------------------------------------
        // CONTROL DE VIDEOS
        // ---------------------------------------

        function playTargetVideo(video) {

            // Detener el otro video
            if (activeVideo && activeVideo !== video) {

                activeVideo.pause();

            }

            activeVideo = video;

            video.play().catch(error => {
                console.log("Error reproduciendo video:", error);
            });

        }

        function pauseTargetVideo(video) {

            video.pause();

            if (activeVideo === video) {
                activeVideo = null;
                activeVideoPlane = null;
            }

        }

        // ---------------------------------------
        // MARCADOR 1
        // ---------------------------------------

        target1.addEventListener("targetFound", () => {

            target1Visible = true;

            activeVideoPlane = videoPlane1;

            video2.pause();

            playTargetVideo(video1);

        });

        target1.addEventListener("targetLost", () => {

            target1Visible = false;

            pauseTargetVideo(video1);

        });

        // ---------------------------------------
        // MARCADOR 2
        // ---------------------------------------

        target2.addEventListener("targetFound", () => {

            target2Visible = true;

            activeVideoPlane = videoPlane2;

            video1.pause();

            playTargetVideo(video2);

        });

        target2.addEventListener("targetLost", () => {

            target2Visible = false;

            pauseTargetVideo(video2);

        });

        // ---------------------------------------
        // AUDIO DEL VIDEO ACTIVO
        // ---------------------------------------

        function toggleAudio() {

            if (!activeVideo) return;

            activeVideo.muted = !activeVideo.muted;

            updateAudioIcon();

        }

        function updateAudioIcon() {

            const isMuted = !activeVideo || activeVideo.muted;

            iconSoundOn.style.display = isMuted ? "none" : "block";
            iconSoundOff.style.display = isMuted ? "block" : "none";

        }

        audioButton.addEventListener("click", toggleAudio);

        // ---------------------------------------
        // PANTALLA COMPLETA
        // ---------------------------------------

        fullscreenButton.addEventListener("click", async () => {

            try {

                if (!document.fullscreenElement) {

                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.log("No se pudo cambiar pantalla completa:", error);

            }

        });

        function updateFullscreenIcon() {

            const isFullscreen = !!document.fullscreenElement;

            iconMaximize.style.display = isFullscreen ? "none" : "block";
            iconMinimize.style.display = isFullscreen ? "block" : "none";

            scheduleARResize();

        }

        document.addEventListener("fullscreenchange", updateFullscreenIcon);

        // ---------------------------------------
        // AJUSTE DE MINDAR PARA CAMBIO DE ORIENTACIÓN
        // ---------------------------------------

        function resizeMindARSystem() {

            const system = patchedSystem;

            if (!system || !system.controller || !system.video || !system.container) {
                return;
            }

            const videoCamera = system.video;
            const container = system.container;

            if (!videoCamera.videoWidth || !videoCamera.videoHeight) {
                return;
            }

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            if (!containerWidth || !containerHeight) return;

            videoCamera.setAttribute("width", videoCamera.videoWidth);
            videoCamera.setAttribute("height", videoCamera.videoHeight);

            const videoRatio = videoCamera.videoWidth / videoCamera.videoHeight;
            const containerRatio = containerWidth / containerHeight;

            let vw, vh;

            if (videoRatio > containerRatio) {

                vh = containerHeight;
                vw = vh * videoRatio;

            } else {

                vw = containerWidth;
                vh = vw / videoRatio;

            }

            const projection = system.controller.getProjectionMatrix();

            const inputRatio =
                system.controller.inputWidth / system.controller.inputHeight;

            let inputAdjust;

            if (inputRatio > containerRatio) {

                inputAdjust = videoCamera.width / system.controller.inputWidth;

            } else {

                inputAdjust = videoCamera.height / system.controller.inputHeight;

            }

            let videoDisplayHeight;

            if (inputRatio > containerRatio) {

                videoDisplayHeight = containerHeight;
                videoDisplayHeight *= inputAdjust;

            } else {

                const videoDisplayWidth = containerWidth;

                videoDisplayHeight =
                    videoDisplayWidth /
                    system.controller.inputWidth *
                    system.controller.inputHeight;

                videoDisplayHeight *= inputAdjust;

            }

            const fovAdjust = containerHeight / videoDisplayHeight;

            const fov =
                2 * Math.atan(1 / projection[5] * fovAdjust) * 180 / Math.PI;

            const near = projection[14] / (projection[10] - 1.0);
            const far = projection[14] / (projection[10] + 1.0);

            const cameraElement = container.getElementsByTagName("a-camera")[0];

            if (!cameraElement) return;

            const threeCamera = cameraElement.getObject3D("camera");

            if (!threeCamera) return;

            threeCamera.fov = fov;
            threeCamera.near = near;
            threeCamera.far = far;
            threeCamera.aspect = containerWidth / containerHeight;

            threeCamera.updateProjectionMatrix();

            videoCamera.style.top = (-(vh - containerHeight) / 2) + "px";
            videoCamera.style.left = (-(vw - containerWidth) / 2) + "px";

            videoCamera.style.width = vw + "px";
            videoCamera.style.height = vh + "px";

            if (scene.canvas && scene.renderer) {

                scene.canvas.style.position = "absolute";
                scene.canvas.style.left = "0px";
                scene.canvas.style.top = "0px";
                scene.canvas.style.width = containerWidth + "px";
                scene.canvas.style.height = containerHeight + "px";

                scene.renderer.setSize(containerWidth, containerHeight, false);

            }

            console.log("MindAR recalibrado:", containerWidth, containerHeight);

        }

        // ---------------------------------------
        // PROGRAMAR REAJUSTE
        // ---------------------------------------

        function scheduleARResize() {

            if (!experienceStarted) return;

            clearTimeout(resizeTimer);

            resizeTimer = setTimeout(() => {

                resizeMindARSystem();

            }, 400);

        }

        // ---------------------------------------
        // INSTALAR CORRECCIÓN AL ESTAR LISTO AR
        // ---------------------------------------

        scene.addEventListener("arReady", () => {

            const system = scene.systems["mindar-image-system"];

            if (!system) return;

            patchedSystem = system;

            system._resize = resizeMindARSystem;

            window.addEventListener("resize", scheduleARResize);
            window.addEventListener("orientationchange", scheduleARResize);

            if (screen.orientation) {

                screen.orientation.addEventListener(
                    "change",
                    scheduleARResize
                );

            }

            if (window.visualViewport) {

                window.visualViewport.addEventListener(
                    "resize",
                    scheduleARResize
                );

            }

            scheduleARResize();

        });

        // ---------------------------------------
        // VISIBILIDAD DE PÁGINA
        // ---------------------------------------

        document.addEventListener("visibilitychange", () => {

            if (document.hidden) {

                video1.pause();
                video2.pause();

            } else {

                if (target1Visible) {

                    playTargetVideo(video1);

                } else if (target2Visible) {

                    playTargetVideo(video2);

                }

            }

            updateAudioIcon();

        });

        // ---------------------------------------
        // TOCAR VIDEO PARA ACTIVAR / DESACTIVAR AUDIO
        // ---------------------------------------

        scene.addEventListener("loaded", () => {

            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();

            scene.canvas.addEventListener("pointerup", (event) => {

                if (!experienceStarted || !activeVideoPlane) return;

                const rect = scene.canvas.getBoundingClientRect();

                pointer.x =
                    ((event.clientX - rect.left) / rect.width) * 2 - 1;

                pointer.y =
                    -((event.clientY - rect.top) / rect.height) * 2 + 1;

                const threeCamera = camera.getObject3D("camera");

                if (!threeCamera) return;

                raycaster.setFromCamera(pointer, threeCamera);

                const intersections = raycaster.intersectObject(
                    activeVideoPlane.object3D,
                    true
                );

                if (intersections.length > 0) {

                    toggleAudio();

                }

            });

        });

        // ---------------------------------------
        // ESTADO INICIAL
        // ---------------------------------------

        updateAudioIcon();
        updateFullscreenIcon();

    </script>

</body>
</html>
