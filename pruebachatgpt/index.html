
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Experiencia WebAR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            position: fixed;
            inset: 0;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: fixed !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden;
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #fff;
            text-align: center;
            padding: 25px;
        }

        #start-button {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #000;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #scan-message {
            position: fixed;
            z-index: 900;
            left: 50%;
            bottom: max(45px, calc(env(safe-area-inset-bottom) + 25px));
            transform: translateX(-50%);
            width: min(90%, 420px);
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(0, 0, 0, .70);
            color: #fff;
            text-align: center;
            font-size: 16px;
            line-height: 1.4;
            font-weight: 500;
            display: none;
            pointer-events: none;
        }

        .control-button {
            position: fixed;
            z-index: 1100;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .55);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 10px;
        }

        .control-button svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #fullscreen-button {
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
        }

        #audio-button {
            top: max(78px, calc(env(safe-area-inset-top) + 58px));
            right: max(20px, env(safe-area-inset-right));
        }

        .a-enter-vr,
        .a-enter-ar {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- Pantalla inicial -->
    <div id="splash-screen">
        <button id="start-button">INICIAR EXPERIENCIA</button>
    </div>

    <!-- Mensaje de escaneo -->
    <div id="scan-message">
        Por favor, escanea la imagen para iniciar la experiencia.
    </div>

    <!-- Botón pantalla completa -->
    <button id="fullscreen-button" class="control-button" aria-label="Pantalla completa">

        <svg id="fullscreen-icon" viewBox="0 0 24 24">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
            <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
        </svg>

    </button>

    <!-- Botón de audio -->
    <button id="audio-button" class="control-button" aria-label="Activar o desactivar audio">

        <svg id="sound-on-icon" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>

        <svg id="sound-off-icon" viewBox="0 0 24 24" style="display:none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>

    </button>


    <!-- Escena AR -->
    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            maxTrack: 1;
            filterMinCF: 0.0005;
            filterBeta: 1000;
            warmupTolerance: 5;
            missTolerance: 5;
        "
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-assets>

            <!-- Video del primer marcador -->
            <video
                id="video1"
                src="./video1.mp4"
                preload="auto"
                loop
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>

            <!-- Video del segundo marcador -->
            <video
                id="video2"
                src="./video2.mp4"
                preload="auto"
                loop
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>

        </a-assets>


        <!-- Cámara -->
        <a-camera
            id="camera"
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>


        <!-- Primer marcador -->
        <a-entity id="target1" mindar-image-target="targetIndex: 0">

            <a-video
                id="video-plane-1"
                src="#video1"
                width="1"
                height="0.5625"
                position="0 0 0"
                material="shader: flat; side: double"
            ></a-video>

        </a-entity>


        <!-- Segundo marcador -->
        <a-entity id="target2" mindar-image-target="targetIndex: 1">

            <a-video
                id="video-plane-2"
                src="#video2"
                width="1"
                height="0.5625"
                position="0 0 0"
                material="shader: flat; side: double"
            ></a-video>

        </a-entity>

    </a-scene>


    <script>
        // =========================================
        // ELEMENTOS PRINCIPALES
        // =========================================

        const scene = document.querySelector("a-scene");

        const splash = document.getElementById("splash-screen");
        const startButton = document.getElementById("start-button");

        const fullscreenButton = document.getElementById("fullscreen-button");
        const audioButton = document.getElementById("audio-button");

        const fullscreenIcon = document.getElementById("fullscreen-icon");

        const soundOnIcon = document.getElementById("sound-on-icon");
        const soundOffIcon = document.getElementById("sound-off-icon");

        const scanMessage = document.getElementById("scan-message");

        const target1 = document.getElementById("target1");
        const target2 = document.getElementById("target2");

        const video1 = document.getElementById("video1");
        const video2 = document.getElementById("video2");

        const videoPlane1 = document.getElementById("video-plane-1");
        const videoPlane2 = document.getElementById("video-plane-2");


        // =========================================
        // DETECTAR IPHONE SAFARI
        // =========================================

        const isIPhone = /iPhone|iPod/i.test(navigator.userAgent);

        const isSafari =
            /Safari/i.test(navigator.userAgent) &&
            !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/i.test(navigator.userAgent);

        const isIPhoneSafari = isIPhone && isSafari;

        if (isIPhoneSafari) {
            fullscreenButton.style.display = "none";
        }


        // =========================================
        // VARIABLES
        // =========================================

        let experienceStarted = false;

        let target1Visible = false;
        let target2Visible = false;

        let activeVideo = null;
        let activeVideoPlane = null;

        let userMuted = false;

        let patchedSystem = null;

        let resizeTimeout = null;


        // =========================================
        // MENSAJE DE ESCANEO
        // =========================================

        function updateScanMessage() {

            if (
                experienceStarted &&
                !target1Visible &&
                !target2Visible
            ) {
                scanMessage.style.display = "block";
            } else {
                scanMessage.style.display = "none";
            }

        }


        // =========================================
        // CONTROL DE AUDIO
        // =========================================

        function updateAudioIcon() {

            const muted = !activeVideo || activeVideo.muted;

            soundOnIcon.style.display = muted ? "none" : "block";
            soundOffIcon.style.display = muted ? "block" : "none";

        }


        function toggleAudio() {

            if (!activeVideo) return;

            activeVideo.muted = !activeVideo.muted;

            userMuted = activeVideo.muted;

            updateAudioIcon();

        }


        // =========================================
        // REPRODUCCIÓN DE VIDEOS
        // =========================================

        async function playTargetVideo(video, plane) {

            if (activeVideo && activeVideo !== video) {
                activeVideo.pause();
            }

            if (video1 !== video) video1.pause();
            if (video2 !== video) video2.pause();

            activeVideo = video;
            activeVideoPlane = plane;

            // Intentar reproducir con sonido.
            video.muted = userMuted;

            try {

                await video.play();

            } catch (error) {

                console.warn(
                    "El navegador bloqueó la reproducción con audio:",
                    error
                );

                // Si el navegador bloquea el audio,
                // intentar reproducir en silencio.
                video.muted = true;

                try {

                    await video.play();

                } catch (secondError) {

                    console.error(
                        "No se pudo reproducir el video:",
                        secondError
                    );

                }

            }

            updateAudioIcon();

        }


        function pauseTargetVideo(video) {

            video.pause();

            if (activeVideo === video) {

                activeVideo = null;
                activeVideoPlane = null;

            }

            updateAudioIcon();

        }


        // =========================================
        // EVENTOS DE LOS MARCADORES
        // =========================================

        target1.addEventListener("targetFound", () => {

            console.log("Primer marcador detectado");

            target1Visible = true;

            updateScanMessage();

            playTargetVideo(video1, videoPlane1);

        });


        target1.addEventListener("targetLost", () => {

            console.log("Primer marcador perdido");

            target1Visible = false;

            pauseTargetVideo(video1);

            updateScanMessage();

        });


        target2.addEventListener("targetFound", () => {

            console.log("Segundo marcador detectado");

            target2Visible = true;

            updateScanMessage();

            playTargetVideo(video2, videoPlane2);

        });


        target2.addEventListener("targetLost", () => {

            console.log("Segundo marcador perdido");

            target2Visible = false;

            pauseTargetVideo(video2);

            updateScanMessage();

        });


        // =========================================
        // INICIAR EXPERIENCIA
        // =========================================

        startButton.addEventListener("click", async () => {

            if (experienceStarted) return;

            try {

                startButton.disabled = true;
                startButton.textContent = "INICIANDO...";


                // Intento de desbloqueo de audio durante
                // el gesto del usuario, antes de cualquier await.
                const audioUnlockPromises = [video1, video2].map(video => {

                    video.muted = false;

                    try {

                        const promise = video.play();

                        if (promise && typeof promise.then === "function") {

                            return promise.then(() => {

                                video.pause();
                                video.currentTime = 0;

                                return true;

                            }).catch(error => {

                                video.muted = true;

                                console.warn(
                                    "No se pudo desbloquear audio:",
                                    error
                                );

                                return false;

                            });

                        }

                        video.pause();

                        return Promise.resolve(true);

                    } catch (error) {

                        video.muted = true;

                        return Promise.resolve(false);

                    }

                });


                // Activar pantalla completa cuando sea compatible.
                let fullscreenPromise = Promise.resolve();

                if (!isIPhoneSafari && !document.fullscreenElement) {

                    const element = document.documentElement;

                    if (element.requestFullscreen) {

                        fullscreenPromise = element.requestFullscreen().catch(error => {

                            console.warn(
                                "No fue posible activar pantalla completa:",
                                error
                            );

                        });

                    }

                }


                // Iniciar MindAR.
                await scene.systems["mindar-image-system"].start();


                experienceStarted = true;

                splash.style.display = "none";

                if (!isIPhoneSafari) {
                    fullscreenButton.style.display = "flex";
                }

                audioButton.style.display = "flex";

                // Mantener la preferencia inicial de sonido activado.
                userMuted = false;

                // Esperar el resultado del intento de desbloqueo.
                Promise.all(audioUnlockPromises).then(results => {

                    console.log("Resultado de desbloqueo de audio:", results);

                });

                updateAudioIcon();

                updateScanMessage();

                await fullscreenPromise;

                scheduleARResize();

            } catch (error) {

                console.error("Error al iniciar la experiencia AR:", error);

                startButton.disabled = false;
                startButton.textContent = "INTENTAR DE NUEVO";

                alert(
                    "No se pudo iniciar la experiencia. " +
                    "Verifica los permisos de cámara e inténtalo nuevamente."
                );

            }

        });


        // =========================================
        // BOTÓN DE AUDIO
        // =========================================

        audioButton.addEventListener("click", (event) => {

            event.stopPropagation();

            toggleAudio();

        });


        // =========================================
        // BOTÓN DE PANTALLA COMPLETA
        // =========================================

        function updateFullscreenIcon() {

            if (document.fullscreenElement) {

                fullscreenIcon.innerHTML = `
                    <path d="M8 3v5H3"/>
                    <path d="M16 3v5h5"/>
                    <path d="M3 16h5v5"/>
                    <path d="M21 16h-5v5"/>
                `;

            } else {

                fullscreenIcon.innerHTML = `
                    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                    <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                    <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                    <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
                `;

            }

        }


        fullscreenButton.addEventListener("click", async (event) => {

            event.stopPropagation();

            if (isIPhoneSafari) return;

            try {

                if (!document.fullscreenElement) {

                    await document.documentElement.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.warn("Error al cambiar pantalla completa:", error);

            }

            updateFullscreenIcon();

            scheduleARResize();

        });


        document.addEventListener("fullscreenchange", () => {

            updateFullscreenIcon();

            scheduleARResize();

        });


        // =========================================
        // DETECCIÓN DE TOQUES SOBRE EL VIDEO
        // =========================================

        const raycaster = new THREE.Raycaster();

        const pointer = new THREE.Vector2();


        function handleVideoTouch(event) {

            if (!activeVideoPlane || !activeVideo) return;

            const canvas = scene.canvas;

            if (!canvas) return;

            const rect = canvas.getBoundingClientRect();

            const touch = event.changedTouches
                ? event.changedTouches[0]
                : event;

            pointer.x =
                ((touch.clientX - rect.left) / rect.width) * 2 - 1;

            pointer.y =
                -((touch.clientY - rect.top) / rect.height) * 2 + 1;


            const cameraObject = document
                .querySelector("#camera")
                .getObject3D("camera");

            if (!cameraObject) return;

            raycaster.setFromCamera(pointer, cameraObject);

            const intersections = raycaster.intersectObject(
                activeVideoPlane.object3D,
                true
            );

            if (intersections.length > 0) {

                toggleAudio();

            }

        }


        document.addEventListener("click", (event) => {

            if (
                event.target.closest("#fullscreen-button") ||
                event.target.closest("#audio-button") ||
                event.target.closest("#start-button")
            ) {
                return;
            }

            handleVideoTouch(event);

        });


        // =========================================
        // RECALIBRACIÓN DE MINDAR
        // =========================================

        function resizeMindARSystem() {

            const system = patchedSystem;

            if (
                !system ||
                !system.controller ||
                !system.video ||
                !system.container
            ) {
                return;
            }

            const videoCamera = system.video;
            const container = system.container;

            if (!videoCamera.videoWidth || !videoCamera.videoHeight) {
                return;
            }

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            if (!containerWidth || !containerHeight) {
                return;
            }

            videoCamera.setAttribute("width", videoCamera.videoWidth);
            videoCamera.setAttribute("height", videoCamera.videoHeight);

            const videoRatio =
                videoCamera.videoWidth / videoCamera.videoHeight;

            const containerRatio =
                containerWidth / containerHeight;

            let vw, vh;

            if (videoRatio > containerRatio) {

                vh = containerHeight;
                vw = vh * videoRatio;

            } else {

                vw = containerWidth;
                vh = vw / videoRatio;

            }


            const projection = system.controller.getProjectionMatrix();

            const inputRatio =
                system.controller.inputWidth /
                system.controller.inputHeight;

            let inputAdjust;

            if (inputRatio > containerRatio) {

                inputAdjust =
                    videoCamera.width / system.controller.inputWidth;

            } else {

                inputAdjust =
                    videoCamera.height / system.controller.inputHeight;

            }


            let videoDisplayHeight;

            if (inputRatio > containerRatio) {

                videoDisplayHeight = containerHeight;
                videoDisplayHeight *= inputAdjust;

            } else {

                const videoDisplayWidth = containerWidth;

                videoDisplayHeight =
                    videoDisplayWidth /
                    system.controller.inputWidth *
                    system.controller.inputHeight;

                videoDisplayHeight *= inputAdjust;

            }


            const fovAdjust = containerHeight / videoDisplayHeight;

            const fov =
                2 * Math.atan(1 / projection[5] * fovAdjust) *
                180 / Math.PI;

            const near =
                projection[14] / (projection[10] - 1.0);

            const far =
                projection[14] / (projection[10] + 1.0);


            const cameraElement =
                container.getElementsByTagName("a-camera")[0];

            if (!cameraElement) return;

            const threeCamera = cameraElement.getObject3D("camera");

            if (!threeCamera) return;

            threeCamera.fov = fov;
            threeCamera.near = near;
            threeCamera.far = far;
            threeCamera.aspect = containerWidth / containerHeight;

            threeCamera.updateProjectionMatrix();


            videoCamera.style.position = "absolute";

            videoCamera.style.top =
                (-(vh - containerHeight) / 2) + "px";

            videoCamera.style.left =
                (-(vw - containerWidth) / 2) + "px";

            videoCamera.style.width = vw + "px";
            videoCamera.style.height = vh + "px";


            if (scene.canvas && scene.renderer) {

                scene.canvas.style.position = "absolute";
                scene.canvas.style.left = "0px";
                scene.canvas.style.top = "0px";

                scene.canvas.style.width = containerWidth + "px";
                scene.canvas.style.height = containerHeight + "px";

                scene.renderer.setSize(
                    containerWidth,
                    containerHeight,
                    false
                );

            }

            console.log(
                "MindAR recalibrado:",
                containerWidth,
                containerHeight
            );

        }


        function scheduleARResize() {

            if (!experienceStarted) return;

            clearTimeout(resizeTimeout);

            resizeTimeout = setTimeout(() => {

                resizeMindARSystem();

                requestAnimationFrame(() => {
                    resizeMindARSystem();
                });

                setTimeout(() => resizeMindARSystem(), 300);

                setTimeout(() => resizeMindARSystem(), 700);

            }, 150);

        }


        // =========================================
        // EVENTOS DE MINDAR
        // =========================================

        scene.addEventListener("arReady", () => {

            console.log("MindAR está listo");

            patchedSystem =
                scene.systems["mindar-image-system"];

            if (patchedSystem) {

                patchedSystem._resize = resizeMindARSystem;

            }

            window.addEventListener("resize", scheduleARResize);

            window.addEventListener("orientationchange", scheduleARResize);

            if (screen.orientation) {

                screen.orientation.addEventListener(
                    "change",
                    scheduleARResize
                );

            }

            if (window.visualViewport) {

                window.visualViewport.addEventListener(
                    "resize",
                    scheduleARResize
                );

            }

            scheduleARResize();

        });


        scene.addEventListener("arError", (event) => {

            console.error("Error de MindAR:", event);

        });


        // =========================================
        // VISIBILIDAD DE LA PÁGINA
        // =========================================

        document.addEventListener("visibilitychange", () => {

            if (document.hidden) {

                if (activeVideo) {
                    activeVideo.pause();
                }

            } else {

                if (target1Visible) {

                    playTargetVideo(video1, videoPlane1);

                } else if (target2Visible) {

                    playTargetVideo(video2, videoPlane2);

                }

            }

        });

    </script>

</body>
</html>
