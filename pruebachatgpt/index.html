
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Experiencia WebAR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            position: fixed;
            inset: 0;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: fixed !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden;
        }


        #scan-message {
            position: fixed;
            z-index: 900;
            left: 50%;
            bottom: max(45px, calc(env(safe-area-inset-bottom) + 25px));
            transform: translateX(-50%);
            width: min(90%, 420px);
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(0, 0, 0, .70);
            color: #fff;
            text-align: center;
            font-size: 16px;
            line-height: 1.4;
            font-weight: 500;
            display: block;
            pointer-events: none;
        }

        .control-button {
            position: fixed;
            z-index: 1100;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .55);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 10px;
        }

        .control-button svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #fullscreen-button {
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
        }

        #audio-button {
            top: max(78px, calc(env(safe-area-inset-top) + 58px));
            right: max(20px, env(safe-area-inset-right));
        }



        /* CONTROLES DE GRABACIÓN Y COMPARTIR */
        #recording-controls {
            position: fixed;
            z-index: 1200;
            right: max(18px, env(safe-area-inset-right));
            bottom: max(22px, env(safe-area-inset-bottom));
            display: none;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .record-action {
            min-height: 48px;
            padding: 0 17px;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 28px;
            background: rgba(0,0,0,.78);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0,0,0,.25);
            -webkit-tap-highlight-color: transparent;
        }

        #record-button .record-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3030;
        }

        #record-button.is-recording .record-dot {
            border-radius: 3px;
            animation: recording-pulse 1.1s infinite;
        }

        #share-button {
            display: none;
            background: #1479e8;
            border-color: transparent;
        }

        #recording-status {
            display: none;
            max-width: min(80vw, 280px);
            padding: 7px 11px;
            border-radius: 8px;
            background: rgba(0,0,0,.72);
            color: #fff;
            font-size: 12px;
            line-height: 1.35;
            text-align: right;
        }

        #download-progress-wrap { display: none !important; }

        #download-progress-track {
            width: 100%;
            height: 8px;
            margin-top: 7px;
            overflow: hidden;
            border-radius: 10px;
            background: rgba(255,255,255,.25);
        }

        #download-progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: #36c878;
            transition: width .12s linear;
        }

        #download-progress-label {
            display: block;
            margin-top: 5px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        @keyframes recording-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .45; }
        }

        .a-enter-vr,
        .a-enter-ar {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- MENSAJE DE ESCANEO -->
    <div id="scan-message">
        Apunta la cámara hacia una de las imágenes para ver la experiencia.
    </div>

    <!-- BOTÓN PANTALLA COMPLETA -->
    <button id="fullscreen-button" class="control-button" aria-label="Pantalla completa">

        <svg id="fullscreen-icon" viewBox="0 0 24 24">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
            <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
        </svg>

    </button>

    <!-- BOTÓN AUDIO -->
    <button id="audio-button" class="control-button" aria-label="Activar o desactivar audio">

        <svg id="sound-on-icon" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>

        <svg id="sound-off-icon" viewBox="0 0 24 24" style="display:none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>

    </button>




    <!-- CONTROLES PARA GRABAR Y COMPARTIR LA EXPERIENCIA -->
    <div id="recording-controls" aria-live="polite">
        <div id="recording-status" style="display:none"></div>
        <div id="download-progress-wrap" style="display:none !important" role="status" aria-live="polite">
            <span id="download-progress-title">Preparando archivo…</span>
            <div id="download-progress-track">
                <div id="download-progress-bar"></div>
            </div>
            <span id="download-progress-label">0%</span>
        </div>
        <button id="share-button" class="record-action" type="button" style="display:none">
            <span aria-hidden="true">↓</span> Descargar video
        </button>
        <button id="record-button" class="record-action" type="button">
            <span class="record-dot" aria-hidden="true"></span>
            <span id="record-button-label">Grabar experiencia</span>
        </button>
    </div>

    <!-- ESCENA AR -->
    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: true;
            maxTrack: 1;
            filterMinCF: 0.0005;
            filterBeta: 1000;
            warmupTolerance: 5;
            missTolerance: 5;
        "
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-assets>

    <img id="minion" src="images/minion.png">
    <img id="mickey" src="images/mickey.png">
    <img id="dedo_arriba" src="images/dedo-arriba.png">
    <img id="dedos_abajo" src="images/dedos-abajo.png">

            <!-- VIDEO PRIMER MARCADOR -->
            <video
                id="video1"
                src="./video1.mp4"
                preload="auto"
                loop
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>

            <!-- VIDEO SEGUNDO MARCADOR -->
            <video
                id="video2"
                src="./video2.mp4"
                preload="auto"
                loop
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>

        </a-assets>


        <!-- CÁMARA -->
        <a-camera
            id="camera"
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>


        <!-- PRIMER MARCADOR -->
        <a-entity id="target1" mindar-image-target="targetIndex: 0">

            <a-video
                id="video-plane-1"
                src="#video1"
                width="1"
                height="0.5625"
                position="0 0 0"
                material="shader: flat; side: double"
            ></a-video>

        </a-entity>


        <!-- SEGUNDO MARCADOR -->
        <a-entity id="target2" mindar-image-target="targetIndex: 1">

            <a-video
                id="video-plane-2"
                src="#video2"
                width="1"
                height="0.5625"
                position="0 0 0.1"
                material="shader: flat; side: double"
            ></a-video>

            <a-image src="#mickey" position="-0.80 0 0" rotation="" scale="1 1 1" material="" geometry="" visible=""></a-image>

        </a-entity>

    </a-scene>


    <script>

        // =========================================
        // ELEMENTOS PRINCIPALES
        // =========================================

        const scene = document.querySelector("a-scene");

        const fullscreenButton = document.getElementById("fullscreen-button");
        const audioButton = document.getElementById("audio-button");

        const fullscreenIcon = document.getElementById("fullscreen-icon");

        const soundOnIcon = document.getElementById("sound-on-icon");
        const soundOffIcon = document.getElementById("sound-off-icon");

        const scanMessage = document.getElementById("scan-message");

        const target1 = document.getElementById("target1");
        const target2 = document.getElementById("target2");

        const video1 = document.getElementById("video1");
        const video2 = document.getElementById("video2");

        const videoPlane1 = document.getElementById("video-plane-1");
        const videoPlane2 = document.getElementById("video-plane-2");


        // =========================================
        // DETECTAR DISPOSITIVO Y CONFIGURAR AUDIO
        // =========================================

        const userAgent = navigator.userAgent || "";

        const isIOS =
            /iPhone|iPad|iPod/i.test(userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        const isSafari =
            /Safari/i.test(userAgent) &&
            !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/i.test(userAgent);

        const isIPhoneSafari = isIOS && isSafari;

        // Safari en iPhone no permite de forma fiable autoplay con sonido.
        // En iOS iniciamos silenciado; en Android intentamos iniciar con sonido.
        const defaultMuted = isIOS;

        video1.muted = defaultMuted;
        video2.muted = defaultMuted;

        if (isIPhoneSafari) {
            fullscreenButton.style.display = "none";
        }

        // =========================================
        // VARIABLES
        // =========================================

        // La experiencia entra directamente en modo escaneo.
        let experienceStarted = true;

        let target1Visible = false;
        let target2Visible = false;

        let activeVideo = null;
        let activeVideoPlane = null;

        // Preferencia inicial: iOS silenciado, Android con sonido.
        // Si Android bloquea autoplay con sonido, el video se silenciará
        // como alternativa sin detener la experiencia.
        let userMuted = defaultMuted;

        let patchedSystem = null;
        let resizeTimeout = null;


        // =========================================
        // MENSAJE DE ESCANEO
        // =========================================

        function updateScanMessage() {

            if (
                !target1Visible &&
                !target2Visible
            ) {

                scanMessage.style.display = "block";

            } else {

                scanMessage.style.display = "none";

            }

        }

        updateScanMessage();
        updateAudioIcon();


        // =========================================
        // CONTROL DE AUDIO
        // =========================================

        function updateAudioIcon() {

            const muted = !activeVideo || userMuted;

            soundOnIcon.style.display = muted ? "none" : "block";
            soundOffIcon.style.display = muted ? "block" : "none";

        }


        function setVideoPlaybackMuted(video, muted) {
            const nodes = videoAudioNodes.get(video);

            // Con Web Audio controlamos el volumen mediante GainNode.
            // El audio grabado se mantiene independiente del botón de silencio.
            if (nodes) {
                video.muted = false;
                nodes.playbackGain.gain.setTargetAtTime(
                    muted ? 0 : 1,
                    audioContext.currentTime,
                    0.015
                );
            } else {
                video.muted = muted;
            }
        }


        function toggleAudio() {

            if (!activeVideo) return;

            userMuted = !userMuted;
            setVideoPlaybackMuted(activeVideo, userMuted);

            updateAudioIcon();

        }


        async function prepareRecordingAudio() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                throw new Error("Este navegador no permite mezclar el audio de los videos.");
            }

            if (!audioContext) {
                audioContext = new AudioContextClass();
            }
            if (audioContext.state === "suspended") {
                await audioContext.resume();
            }

            recordingAudioDestination = audioContext.createMediaStreamDestination();

            [video1, video2].forEach(video => {
                let nodes = videoAudioNodes.get(video);

                if (!nodes) {
                    // createMediaElementSource se crea una sola vez por elemento.
                    const source = audioContext.createMediaElementSource(video);
                    const playbackGain = audioContext.createGain();
                    const recordingGain = audioContext.createGain();

                    source.connect(playbackGain);
                    playbackGain.connect(audioContext.destination);
                    source.connect(recordingGain);

                    nodes = { source, playbackGain, recordingGain };
                    videoAudioNodes.set(video, nodes);
                }

                // La grabación recibe el audio original aunque el usuario
                // haya silenciado los altavoces con el botón de la experiencia.
                nodes.recordingGain.gain.setValueAtTime(1, audioContext.currentTime);
                nodes.recordingGain.connect(recordingAudioDestination);

                // El volumen que escucha el usuario sí respeta el botón de audio.
                video.muted = false;
                nodes.playbackGain.gain.setValueAtTime(
                    userMuted ? 0 : 1,
                    audioContext.currentTime
                );
            });

            microphoneAudioSource = audioContext.createMediaStreamSource(microphoneStream);
            microphoneAudioSource.connect(recordingAudioDestination);

            return recordingAudioDestination.stream.getAudioTracks();
        }


        // =========================================
        // REPRODUCCIÓN DE VIDEOS
        // =========================================

        async function playTargetVideo(video, plane) {

            // Pausar cualquier otro video.
            if (activeVideo && activeVideo !== video) {
                activeVideo.pause();
            }

            if (video1 !== video) video1.pause();
            if (video2 !== video) video2.pause();

            activeVideo = video;
            activeVideoPlane = plane;

            // Aplicar la preferencia inicial del dispositivo o la última
            // elección manual del usuario.
            setVideoPlaybackMuted(video, userMuted);

            // Mostrar el control de audio cuando haya un video activo.
            audioButton.style.display = "flex";

            try {

                await video.play();

            } catch (error) {

                console.warn(
                    "El navegador bloqueó la reproducción con el audio solicitado. " +
                    "Se intentará continuar en silencio:",
                    error
                );

                // Fallback: continuar en silencio para no detener la experiencia.
                setVideoPlaybackMuted(video, true);

                try {

                    await video.play();

                } catch (secondError) {

                    console.error(
                        "No se pudo reproducir el video:",
                        secondError
                    );

                }

            }

            updateAudioIcon();

        }


        function pauseTargetVideo(video) {

            video.pause();

            if (activeVideo === video) {

                activeVideo = null;
                activeVideoPlane = null;

            }

            updateAudioIcon();

        }


        // =========================================
        // EVENTOS DE LOS MARCADORES
        // =========================================

        target1.addEventListener("targetFound", () => {

            console.log("Primer marcador detectado");

            target1Visible = true;

            updateScanMessage();

            playTargetVideo(video1, videoPlane1);

        });


        target1.addEventListener("targetLost", () => {

            console.log("Primer marcador perdido");

            target1Visible = false;

            pauseTargetVideo(video1);

            updateScanMessage();

        });


        target2.addEventListener("targetFound", () => {

            console.log("Segundo marcador detectado");

            target2Visible = true;

            updateScanMessage();

            playTargetVideo(video2, videoPlane2);

        });


        target2.addEventListener("targetLost", () => {

            console.log("Segundo marcador perdido");

            target2Visible = false;

            pauseTargetVideo(video2);

            updateScanMessage();

        });


        // =========================================
        // BOTÓN DE AUDIO
        // =========================================

        audioButton.addEventListener("click", (event) => {

            event.stopPropagation();

            toggleAudio();

        });


        // =========================================
        // BOTÓN PANTALLA COMPLETA
        // =========================================

        function updateFullscreenIcon() {

            if (document.fullscreenElement) {

                fullscreenIcon.innerHTML = `
                    <path d="M8 3v5H3"/>
                    <path d="M16 3v5h5"/>
                    <path d="M3 16h5v5"/>
                    <path d="M21 16h-5v5"/>
                `;

            } else {

                fullscreenIcon.innerHTML = `
                    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                    <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                    <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                    <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
                `;

            }

        }


        fullscreenButton.addEventListener("click", async (event) => {

            event.stopPropagation();

            if (isIPhoneSafari) return;

            try {

                if (!document.fullscreenElement) {

                    await document.documentElement.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.warn(
                    "Error al cambiar pantalla completa:",
                    error
                );

            }

            updateFullscreenIcon();

            scheduleARResize();

        });


        document.addEventListener("fullscreenchange", () => {

            updateFullscreenIcon();

            scheduleARResize();

        });


        // =========================================
        // DETECCIÓN DE TOQUES SOBRE EL VIDEO
        // =========================================

        const raycaster = new THREE.Raycaster();

        const pointer = new THREE.Vector2();


        function handleVideoTouch(event) {

            if (!activeVideoPlane || !activeVideo) return;

            const canvas = scene.canvas;

            if (!canvas) return;

            const rect = canvas.getBoundingClientRect();

            const touch = event.changedTouches
                ? event.changedTouches[0]
                : event;

            pointer.x =
                ((touch.clientX - rect.left) / rect.width) * 2 - 1;

            pointer.y =
                -((touch.clientY - rect.top) / rect.height) * 2 + 1;


            const cameraObject = document
                .querySelector("#camera")
                .getObject3D("camera");

            if (!cameraObject) return;

            raycaster.setFromCamera(pointer, cameraObject);

            const intersections = raycaster.intersectObject(
                activeVideoPlane.object3D,
                true
            );

            if (intersections.length > 0) {

                toggleAudio();

            }

        }


        document.addEventListener("click", (event) => {

            if (
                event.target.closest("#fullscreen-button") ||
                event.target.closest("#audio-button") ||
                event.target.closest("#recording-controls")
            ) {
                return;
            }

            handleVideoTouch(event);

        });


        // =========================================
        // RECALIBRACIÓN DE MINDAR
        // =========================================

        function resizeMindARSystem() {

            const system = patchedSystem;

            if (
                !system ||
                !system.controller ||
                !system.video ||
                !system.container
            ) {
                return;
            }

            const videoCamera = system.video;
            const container = system.container;

            if (
                !videoCamera.videoWidth ||
                !videoCamera.videoHeight
            ) {
                return;
            }

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            if (!containerWidth || !containerHeight) return;

            videoCamera.setAttribute(
                "width",
                videoCamera.videoWidth
            );

            videoCamera.setAttribute(
                "height",
                videoCamera.videoHeight
            );

            const videoRatio =
                videoCamera.videoWidth / videoCamera.videoHeight;

            const containerRatio =
                containerWidth / containerHeight;

            let vw, vh;

            if (videoRatio > containerRatio) {

                vh = containerHeight;
                vw = vh * videoRatio;

            } else {

                vw = containerWidth;
                vh = vw / videoRatio;

            }


            const projection =
                system.controller.getProjectionMatrix();

            const inputRatio =
                system.controller.inputWidth /
                system.controller.inputHeight;

            let inputAdjust;

            if (inputRatio > containerRatio) {

                inputAdjust =
                    videoCamera.width /
                    system.controller.inputWidth;

            } else {

                inputAdjust =
                    videoCamera.height /
                    system.controller.inputHeight;

            }


            let videoDisplayHeight;

            if (inputRatio > containerRatio) {

                videoDisplayHeight = containerHeight;
                videoDisplayHeight *= inputAdjust;

            } else {

                const videoDisplayWidth = containerWidth;

                videoDisplayHeight =
                    videoDisplayWidth /
                    system.controller.inputWidth *
                    system.controller.inputHeight;

                videoDisplayHeight *= inputAdjust;

            }


            const fovAdjust =
                containerHeight / videoDisplayHeight;

            const fov =
                2 * Math.atan(1 / projection[5] * fovAdjust) *
                180 / Math.PI;

            const near =
                projection[14] / (projection[10] - 1.0);

            const far =
                projection[14] / (projection[10] + 1.0);


            const cameraElement =
                container.getElementsByTagName("a-camera")[0];

            if (!cameraElement) return;

            const threeCamera =
                cameraElement.getObject3D("camera");

            if (!threeCamera) return;

            threeCamera.fov = fov;
            threeCamera.near = near;
            threeCamera.far = far;
            threeCamera.aspect =
                containerWidth / containerHeight;

            threeCamera.updateProjectionMatrix();


            videoCamera.style.position = "absolute";

            videoCamera.style.top =
                (-(vh - containerHeight) / 2) + "px";

            videoCamera.style.left =
                (-(vw - containerWidth) / 2) + "px";

            videoCamera.style.width = vw + "px";
            videoCamera.style.height = vh + "px";


            if (scene.canvas && scene.renderer) {

                scene.canvas.style.position = "absolute";
                scene.canvas.style.left = "0px";
                scene.canvas.style.top = "0px";

                scene.canvas.style.width =
                    containerWidth + "px";

                scene.canvas.style.height =
                    containerHeight + "px";

                scene.renderer.setSize(
                    containerWidth,
                    containerHeight,
                    false
                );

            }

            console.log(
                "MindAR recalibrado:",
                containerWidth,
                containerHeight
            );

        }


        function scheduleARResize() {

            if (!experienceStarted) return;

            clearTimeout(resizeTimeout);

            resizeTimeout = setTimeout(() => {

                resizeMindARSystem();

                requestAnimationFrame(() => {
                    resizeMindARSystem();
                });

                setTimeout(
                    () => resizeMindARSystem(),
                    300
                );

                setTimeout(
                    () => resizeMindARSystem(),
                    700
                );

            }, 150);

        }


        // =========================================
        // EVENTOS DE MINDAR
        // =========================================

        scene.addEventListener("arReady", () => {

            console.log("MindAR está listo");

            patchedSystem =
                scene.systems["mindar-image-system"];

            if (patchedSystem) {

                patchedSystem._resize = resizeMindARSystem;

            }

            // La cámara y el reconocimiento ya están activos.
            recordingControls.style.display = "flex";
            if (!isIPhoneSafari) {
                fullscreenButton.style.display = "flex";
            }

            updateScanMessage();

            window.addEventListener(
                "resize",
                scheduleARResize
            );

            window.addEventListener(
                "orientationchange",
                scheduleARResize
            );

            if (screen.orientation) {

                screen.orientation.addEventListener(
                    "change",
                    scheduleARResize
                );

            }

            if (window.visualViewport) {

                window.visualViewport.addEventListener(
                    "resize",
                    scheduleARResize
                );

            }

            scheduleARResize();

        });


        scene.addEventListener("arError", (event) => {

            console.error("Error de MindAR:", event);

        });




        // =========================================
        // GRABAR LA EXPERIENCIA + AUDIO DEL MICRÓFONO
        // =========================================

        const recordingControls = document.getElementById("recording-controls");
        const recordButton = document.getElementById("record-button");
        const recordButtonLabel = document.getElementById("record-button-label");
        const shareButton = document.getElementById("share-button");
        const recordingStatus = document.getElementById("recording-status");
        const downloadProgressWrap = document.getElementById("download-progress-wrap");
        const downloadProgressBar = document.getElementById("download-progress-bar");
        const downloadProgressLabel = document.getElementById("download-progress-label");
        const downloadProgressTitle = document.getElementById("download-progress-title");

        let mediaRecorder = null;
        let recordedChunks = [];
        let recordedBlob = null;
        let microphoneStream = null;
        let canvasStream = null;
        let recordingCanvas = null;
        let recordingContext = null;
        let recordingAnimationId = null;
        let recordingOutputWidth = 0;
        let recordingOutputHeight = 0;
        let recordingOrientation = "portrait";

        // Audio Web Audio: permite mezclar el sonido de los videos AR
        // y el micrófono dentro del archivo grabado.
        let audioContext = null;
        let recordingAudioDestination = null;
        let videoAudioNodes = new Map();
        let microphoneAudioSource = null;

        function drawRecordingFrame() {
            if (!recordingCanvas || !recordingContext) return;

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            if (!viewportWidth || !viewportHeight) return;

            // La orientación del archivo se fija al comenzar: vertical u horizontal.
            // Si el usuario gira el teléfono durante la grabación, la imagen se ajusta
            // dentro del formato elegido, sin cambiar las dimensiones del archivo.
            const scale = Math.min(
                recordingOutputWidth / viewportWidth,
                recordingOutputHeight / viewportHeight
            );
            const offsetX = (recordingOutputWidth - viewportWidth * scale) / 2;
            const offsetY = (recordingOutputHeight - viewportHeight * scale) / 2;

            recordingContext.setTransform(1, 0, 0, 1, 0, 0);
            recordingContext.fillStyle = "#000";
            recordingContext.fillRect(0, 0, recordingOutputWidth, recordingOutputHeight);
            recordingContext.setTransform(scale, 0, 0, scale, offsetX, offsetY);

            const cameraVideo = patchedSystem && patchedSystem.video;
            if (cameraVideo && cameraVideo.readyState >= 2) {
                const cameraRect = cameraVideo.getBoundingClientRect();
                try {
                    recordingContext.drawImage(
                        cameraVideo,
                        cameraRect.left,
                        cameraRect.top,
                        cameraRect.width,
                        cameraRect.height
                    );
                } catch (error) {
                    // El video puede estar temporalmente no disponible al cambiar de cámara.
                }
            }

            if (scene.canvas) {
                try {
                    recordingContext.drawImage(
                        scene.canvas,
                        0,
                        0,
                        viewportWidth,
                        viewportHeight
                    );
                } catch (error) {
                    console.warn("No se pudo componer el canvas AR:", error);
                }
            }

            recordingAnimationId = requestAnimationFrame(drawRecordingFrame);
        }


        function stopRecordingStreams() {
            if (recordingAnimationId) {
                cancelAnimationFrame(recordingAnimationId);
                recordingAnimationId = null;
            }

            if (canvasStream) {
                canvasStream.getTracks().forEach(track => track.stop());
                canvasStream = null;
            }

            if (microphoneAudioSource) {
                try { microphoneAudioSource.disconnect(); } catch (error) {}
                microphoneAudioSource = null;
            }

            if (recordingAudioDestination) {
                videoAudioNodes.forEach(nodes => {
                    try { nodes.recordingGain.disconnect(recordingAudioDestination); } catch (error) {}
                });
                recordingAudioDestination = null;
            }

            if (microphoneStream) {
                microphoneStream.getTracks().forEach(track => track.stop());
                microphoneStream = null;
            }
        }


        function showRecordingError(message) {
            recordingStatus.textContent = message;
            recordingStatus.style.display = "block";
        }


        async function startExperienceRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Tu navegador no permite acceder al micrófono. Abre esta experiencia en Safari o Chrome actualizado y mediante HTTPS.");
                return;
            }

            if (!scene.canvas) {
                alert("La experiencia WebAR todavía no está lista para grabarse.");
                return;
            }

            if (typeof MediaRecorder === "undefined") {
                alert("Tu navegador no es compatible con la grabación de video. Prueba con una versión reciente de Safari o Chrome.");
                return;
            }

            recordButton.disabled = true;
            shareButton.style.display = "none";
            recordingStatus.style.display = "none";
            recordButtonLabel.textContent = "Solicitando micrófono...";

            try {
                // El permiso del micrófono se solicita únicamente cuando el usuario pulsa Grabar.
                microphoneStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // Mezclar audio de ambos videos AR + micrófono.
                const videoAndMicAudioTracks = await prepareRecordingAudio();

                // La orientación se elige automáticamente según la posición del teléfono
                // al pulsar Grabar: vertical 9:16 u horizontal 16:9.
                recordingOrientation = window.innerWidth >= window.innerHeight
                    ? "landscape"
                    : "portrait";

                // Resolución fija para mantener un archivo con proporción consistente.
                if (recordingOrientation === "landscape") {
                    recordingOutputWidth = 1920;
                    recordingOutputHeight = 1080;
                } else {
                    recordingOutputWidth = 1080;
                    recordingOutputHeight = 1920;
                }

                recordingCanvas = document.createElement("canvas");
                recordingCanvas.width = recordingOutputWidth;
                recordingCanvas.height = recordingOutputHeight;
                recordingContext = recordingCanvas.getContext("2d", { alpha: false });

                if (!recordingContext) {
                    throw new Error("No se pudo crear el canvas de grabación.");
                }

                drawRecordingFrame();
                canvasStream = recordingCanvas.captureStream(30);

                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...videoAndMicAudioTracks
                ]);

                const mimeCandidates = [
                    "video/mp4;codecs=avc1.42E01E",
                    "video/mp4",
                    "video/webm;codecs=vp9,opus",
                    "video/webm;codecs=vp8,opus",
                    "video/webm"
                ];

                const supportedMime = mimeCandidates.find(type =>
                    MediaRecorder.isTypeSupported(type)
                );

                mediaRecorder = supportedMime
                    ? new MediaRecorder(combinedStream, { mimeType: supportedMime })
                    : new MediaRecorder(combinedStream);

                recordedChunks = [];
                recordedBlob = null;

                mediaRecorder.ondataavailable = event => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onerror = event => {
                    console.error("Error durante la grabación:", event.error || event);
                    showRecordingError("Ocurrió un error durante la grabación.");
                };

                mediaRecorder.onstop = () => {
                    const mimeType = mediaRecorder.mimeType || "video/webm";
                    recordedBlob = new Blob(recordedChunks, { type: mimeType });
                    stopRecordingStreams();

                    recordButton.classList.remove("is-recording");
                    recordButton.style.display = "none";
                    recordButton.disabled = false;
                    shareButton.style.display = recordedBlob.size > 0 ? "inline-flex" : "none";
                    shareButton.disabled = false;
                    recordingStatus.style.display = "none";
                };

                mediaRecorder.start(1000);
                recordButton.disabled = false;
                recordButton.classList.add("is-recording");
                recordButtonLabel.textContent = "Detener grabación";
                recordingStatus.style.display = "none";
                downloadProgressWrap.style.display = "none";

            } catch (error) {
                console.error("No se pudo iniciar la grabación:", error);
                stopRecordingStreams();
                recordButton.disabled = false;
                recordButtonLabel.textContent = "Grabar experiencia";
                recordingStatus.style.display = "none";
            }
        }


        function stopExperienceRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                recordButton.disabled = true;
                recordButtonLabel.textContent = "Procesando video...";
                mediaRecorder.stop();
            }
        }


        function updateDownloadProgress(percent, title) {
            const value = Math.max(0, Math.min(100, Math.round(percent)));
            downloadProgressWrap.style.display = "block";
            downloadProgressTitle.textContent = title;
            downloadProgressBar.style.width = value + "%";
            downloadProgressLabel.textContent = value + "%";
        }

        async function saveUsingFilePicker(videoFile) {
            // En navegadores compatibles, escribe el archivo por fragmentos
            // y permite mostrar el progreso real del guardado.
            const handle = await window.showSaveFilePicker({
                suggestedName: videoFile.name,
                types: [{
                    description: "Video",
                    accept: {
                        [videoFile.type || "video/webm"]:
                            [videoFile.name.endsWith(".mp4") ? ".mp4" : ".webm"]
                    }
                }]
            });

            const writable = await handle.createWritable();
            const reader = videoFile.stream().getReader();
            let written = 0;
            const total = videoFile.size;

            try {
                while (true) {
                    const result = await reader.read();
                    if (result.done) break;
                    await writable.write(result.value);
                    written += result.value.byteLength;
                    updateDownloadProgress(
                        total ? (written / total) * 100 : 100,
                        "Guardando video…"
                    );
                }
                await writable.close();
                updateDownloadProgress(100, "¡Video guardado correctamente!");
                recordingStatus.style.display = "none";
            } catch (error) {
                try { await writable.abort(); } catch (abortError) {}
                throw error;
            }
        }

        async function shareRecordedVideo() {
            if (!recordedBlob || recordedBlob.size === 0) {
                recordingStatus.textContent = "No hay una grabación disponible para guardar.";
                recordingStatus.style.display = "block";
                return;
            }

            const isMp4 = recordedBlob.type.toLowerCase().includes("mp4");
            const fileName = isMp4
                ? "mi-experiencia-webar.mp4"
                : "mi-experiencia-webar.webm";
            const fileType = recordedBlob.type || (isMp4 ? "video/mp4" : "video/webm");
            const videoFile = new File([recordedBlob], fileName, { type: fileType });

            shareButton.disabled = true;
            updateDownloadProgress(0, "Preparando archivo…");

            try {
                // iPhone/iPad: la hoja nativa de compartir no expone porcentaje
                // ni confirma si el usuario eligió Guardar en Archivos.
                if (isIOS) {
                    downloadProgressWrap.style.display = "none";
                    if (typeof navigator.share === "function") {
                        await navigator.share({
                            files: [videoFile],
                            title: "Mi experiencia WebAR"
                        });
                        shareButton.style.display = "none";
                        recordedBlob = null;
                        recordedChunks = [];
                        recordButton.style.display = "inline-flex";
                        recordButtonLabel.textContent = "Grabar experiencia";
                        recordButton.classList.remove("is-recording");
                        recordButton.disabled = false;
                    } else {
                        recordingStatus.textContent = "No se pudo abrir el menú para guardar. Si se muestra una vista previa, toca Compartir y elige “Guardar en Archivos”.";
                    }
                    recordingStatus.style.display = "none";
                    return;
                }

                // Cuando el navegador admite selector de guardado, podemos
                // confirmar la escritura y mostrar porcentaje real.
                if (typeof window.showSaveFilePicker === "function") {
                    try {
                        await saveUsingFilePicker(videoFile);
                        shareButton.style.display = "none";
                        recordedBlob = null;
                        recordedChunks = [];
                        recordButton.style.display = "inline-flex";
                        recordButtonLabel.textContent = "Grabar experiencia";
                        recordButton.classList.remove("is-recording");
                        recordButton.disabled = false;
                        recordingStatus.style.display = "none";
                        downloadProgressWrap.style.display = "none";
                        return;
                    } catch (pickerError) {
                        if (pickerError && pickerError.name === "AbortError") {
                            recordingStatus.style.display = "none";
                            downloadProgressWrap.style.display = "none";
                            return;
                        }
                        console.warn("No se pudo usar el selector de archivos; se usará descarga normal:", pickerError);
                    }
                }

                // Descarga tradicional: el navegador no ofrece eventos para
                // conocer el avance ni confirmar que el archivo terminó de guardarse.
                const objectUrl = URL.createObjectURL(recordedBlob);
                const downloadLink = document.createElement("a");
                downloadLink.href = objectUrl;
                downloadLink.download = fileName;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                downloadLink.remove();
                shareButton.style.display = "none";
                recordedBlob = null;
                recordedChunks = [];
                recordButton.style.display = "inline-flex";
                recordButtonLabel.textContent = "Grabar experiencia";
                recordButton.classList.remove("is-recording");
                recordButton.disabled = false;
                recordingStatus.style.display = "none";
                downloadProgressWrap.style.display = "none";
                setTimeout(() => URL.revokeObjectURL(objectUrl), 10 * 60 * 1000);
            } catch (error) {
                console.error("No se pudo guardar el video:", error);
                recordingStatus.style.display = "none";
                downloadProgressWrap.style.display = "none";
            } finally {
                shareButton.disabled = false;
            }
        }


        recordButton.addEventListener("click", () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                stopExperienceRecording();
            } else {
                startExperienceRecording();
            }
        });

        shareButton.addEventListener("click", shareRecordedVideo);


        // =========================================
        // VISIBILIDAD DE LA PÁGINA
        // =========================================

        document.addEventListener("visibilitychange", () => {

            if (document.hidden) {

                if (activeVideo) {
                    activeVideo.pause();
                }

            } else {

                if (target1Visible) {

                    playTargetVideo(video1, videoPlane1);

                } else if (target2Visible) {

                    playTargetVideo(video2, videoPlane2);

                }

            }

        });

    </script>
